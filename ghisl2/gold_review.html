<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gold instance review</title>
<style>
  html, body {
    margin:0; padding:0; overflow:hidden; height:100%;
    background: linear-gradient(180deg, #f7ecda 0%, #f0ddc3 55%, #dcbd9c 100%);
  }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
  select, button { font: 13px/1.4 sans-serif; }
  .gold-star { color:#c9890a; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
    "kalidokit": "/node_modules/kalidokit/dist/kalidokit.es.js"
  }
}
</script>
</head>
<body>
<!-- Gold-instance review UI (2026-10-03): lets AK flip through every
     repeated-gesture instance of a word in the full corpus library, watch
     it on the avatar with the exact same (already-approved) retargeting
     pipeline as the main player, and mark one as the "gold" coordinate set
     for sentence assembly to use later. Selection is always a manual click
     here -- nothing in this file auto-picks a winner. -->
<div id="ui" style="position:fixed; top:8px; left:8px; z-index:10; font:13px/1.4 sans-serif; background:rgba(255,255,255,0.92); padding:10px 12px; border-radius:6px; width:360px;">
  <div style="margin-bottom:6px;">
    <a href="/index.html" style="font-size:12px;">&larr; Player</a>
    &nbsp;|&nbsp; <b>Gold review</b>
    &nbsp;|&nbsp; <span id="progress">0 / 0 marked</span>
  </div>
  <div style="margin-bottom:6px;">
    <select id="wordSelect" style="width:100%;"></select>
  </div>
  <div style="margin-bottom:6px;">
    <select id="instanceSelect" style="width:100%;"></select>
  </div>
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
    <button id="playBtn">Play</button>
    <input id="frameSlider" type="range" min="0" max="0" value="0" style="width:140px; vertical-align:middle;">
    <span id="frameLabel">0 / 0</span>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <button id="markBtn">Mark as Gold ★</button>
    <button id="clearBtn">Clear gold for this word</button>
  </div>
  <div id="statusLine" style="margin-top:6px; font-size:12px; color:#555;"></div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
import * as Kalidokit from "kalidokit";

const W = 900, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setClearColor(0xf0ddc3, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Homely backdrop (2026-10-04, AK: "add some background, that should appear
// like a homely setting"; verbatim from index.html). Simple warm vertical
// gradient, no external image assets to source/host -- colors match the
// page's own CSS gradient (see <style> above) so there's no seam.
function makeHomelyBackground() {
  const c = document.createElement("canvas");
  c.width = 2; c.height = 256;
  const ctx = c.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#f7ecda");
  grad.addColorStop(0.55, "#f0ddc3");
  grad.addColorStop(1, "#dcbd9c");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 2, 256);
  return new THREE.CanvasTexture(c);
}
scene.background = makeHomelyBackground();
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 20);
camera.position.set(0, 1.35, 2.2);
camera.lookAt(0, 1.2, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(1, 2, 2);
scene.add(dir);

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));

let vrm = null;
let entry = null;        // currently-loaded instance (same shape as entry_*.json)
let curLibrary = null;   // "dh_library" | "ndh_library" | "head_library", for this entry

function getBone(name) {
  return vrm.humanoid.getNormalizedBoneNode(name);
}

// --- Verbatim from the approved production renderer (public/index.html) ---
// Same bone map, same geometric wrist/palm fit + smoothing, same arm
// retarget, same axis convention, same head/face handling -- this review
// tool must show AK exactly what sentence assembly will actually use, so
// none of this is re-derived or approximated.
const HAND_BONE_MAP = {
  Wrist: "Hand",
  ThumbProximal: "ThumbMetacarpal",
  ThumbIntermediate: "ThumbProximal",
  ThumbDistal: "ThumbDistal",
  IndexProximal: "IndexProximal",
  IndexIntermediate: "IndexIntermediate",
  IndexDistal: "IndexDistal",
  MiddleProximal: "MiddleProximal",
  MiddleIntermediate: "MiddleIntermediate",
  MiddleDistal: "MiddleDistal",
  RingProximal: "RingProximal",
  RingIntermediate: "RingIntermediate",
  RingDistal: "RingDistal",
  LittleProximal: "LittleProximal",
  LittleIntermediate: "LittleIntermediate",
  LittleDistal: "LittleDistal",
};

let handRest = null;
const WRIST_SMOOTHING_ALPHA = 0.4;
let lastHandLocalQuat = { Right: null, Left: null };
function captureHandRest() {
  vrm.scene.updateMatrixWorld(true);
  handRest = {};
  for (const side of ["Right", "Left"]) {
    const p = side.toLowerCase();
    const hand = getBone(p + "Hand");
    const middleProx = getBone(p + "MiddleProximal");
    const indexProx = getBone(p + "IndexProximal");
    const littleProx = getBone(p + "LittleProximal");
    if (!hand || !middleProx || !indexProx || !littleProx) continue;
    const handPos = new THREE.Vector3(); hand.getWorldPosition(handPos);
    const midPos = new THREE.Vector3(); middleProx.getWorldPosition(midPos);
    const idxPos = new THREE.Vector3(); indexProx.getWorldPosition(idxPos);
    const ltlPos = new THREE.Vector3(); littleProx.getWorldPosition(ltlPos);
    const forward = midPos.clone().sub(handPos).normalize();
    const normal = idxPos.clone().sub(handPos).cross(ltlPos.clone().sub(handPos)).normalize();
    const worldQuat = new THREE.Quaternion();
    hand.getWorldQuaternion(worldQuat);
    handRest[side] = { worldQuat, forward, normal };
  }
}

function basisQuatFromVectors(primary, secondary) {
  const x = primary.clone().normalize();
  let z = x.clone().cross(secondary).normalize();
  if (z.lengthSq() < 1e-6) z = x.clone().cross(new THREE.Vector3(0, 1, 0)).normalize();
  const y = z.clone().cross(x).normalize();
  const m = new THREE.Matrix4().makeBasis(x, y, z);
  return new THREE.Quaternion().setFromRotationMatrix(m);
}

function applyHand(landmarks21, side) {
  if (!landmarks21) return false;
  const lm = landmarks21.map(([x, y, z]) => ({ x, y, z }));
  const solved = Kalidokit.Hand.solve(lm, side);
  if (!solved) return false;
  const useGeoFingers = window.__fingerMode !== "kalidokit" && !!(handRest && handRest[side]) && landmarks21.length >= 21;
  for (const [kKey, vrmSuffix] of Object.entries(HAND_BONE_MAP)) {
    const val = solved[side + kKey];
    if (!val) continue;
    const boneName = side.toLowerCase() + vrmSuffix;
    const bone = getBone(boneName);
    if (!bone) continue;
    if (kKey === "Wrist") {
      const rest = handRest && handRest[side];
      if (rest && landmarks21.length >= 18) {
        const wrist = bodyPointToYUp(landmarks21[0]);
        const middleMcp = bodyPointToYUp(landmarks21[9]);
        const indexMcp = bodyPointToYUp(landmarks21[5]);
        const pinkyMcp = bodyPointToYUp(landmarks21[17]);
        const obsForward = middleMcp.clone().sub(wrist).normalize();
        const obsNormal = indexMcp.clone().sub(wrist).cross(pinkyMcp.clone().sub(wrist)).normalize();
        const restBasisQuat = basisQuatFromVectors(rest.forward, rest.normal);
        const obsBasisQuat = basisQuatFromVectors(obsForward, obsNormal);
        const delta = obsBasisQuat.clone().multiply(restBasisQuat.clone().invert());
        const newWorldQuat = delta.clone().multiply(rest.worldQuat);
        const parent = bone.parent;
        const parentWorldQuat = new THREE.Quaternion();
        if (parent) parent.getWorldQuaternion(parentWorldQuat);
        let localQuat = parentWorldQuat.clone().invert().multiply(newWorldQuat);
        const lastLocal = lastHandLocalQuat[side];
        if (lastLocal) localQuat = lastLocal.clone().slerp(localQuat, WRIST_SMOOTHING_ALPHA);
        bone.quaternion.copy(localQuat);
        lastHandLocalQuat[side] = localQuat.clone();
      } else {
        const e = new THREE.Euler(val.x || 0, val.y || 0, val.z || 0, "XYZ");
        bone.quaternion.setFromEuler(e);
        lastHandLocalQuat[side] = null;
      }
    } else {
      // Fidelity pass 2026-10-05: fingers handled by applyFingersGeometric()
      // below; Kalidokit path kept via window.__fingerMode = "kalidokit".
      if (!useGeoFingers) {
        const e = new THREE.Euler(-(val.x || 0), -(val.y || 0), -(val.z || 0), "XYZ");
        bone.quaternion.setFromEuler(e);
      }
    }
  }
  if (useGeoFingers) applyFingersGeometric(landmarks21, side);
  return true;
}

// --- Geometric finger retarget (Fidelity pass, 2026-10-05) -----------------
// Measured against the recorded landmarks (palm-frame segment-direction error,
// all 4 entries): Kalidokit's per-joint Euler angles left fingers 16-40 deg off
// and the dominant-hand thumb tip 52 deg off (non-dominant 29), with a
// left/right-asymmetric bias. Cause: Kalidokit solves joint flexion without
// knowing this rig's rest geometry (finger/thumb bones are not straight at
// rest) and clamps ranges. Fix: same principle as the arm chain -- rotate each
// bone, in its parent's current frame, by the minimal swing that takes its
// rest direction (toward its child) onto the observed landmark segment
// direction. Processed proximal -> distal so each parent is already posed.
// Twist about a finger's own axis is undetermined by landmarks and left to the
// minimal swing. Applies identically to both hands.
const FINGER_CHAINS = {
  Thumb:  { bones: ["ThumbMetacarpal", "ThumbProximal", "ThumbDistal"], lm: [1, 2, 3, 4] },
  Index:  { bones: ["IndexProximal", "IndexIntermediate", "IndexDistal"], lm: [5, 6, 7, 8] },
  Middle: { bones: ["MiddleProximal", "MiddleIntermediate", "MiddleDistal"], lm: [9, 10, 11, 12] },
  Ring:   { bones: ["RingProximal", "RingIntermediate", "RingDistal"], lm: [13, 14, 15, 16] },
  Little: { bones: ["LittleProximal", "LittleIntermediate", "LittleDistal"], lm: [17, 18, 19, 20] },
};
function applyFingersGeometric(lms, side) {
  const prefix = side.toLowerCase();
  const parentQ = new THREE.Quaternion();
  for (const ch of Object.values(FINGER_CHAINS)) {
    for (let k = 0; k < 3; k++) {
      const bone = getBone(prefix + ch.bones[k]);
      if (!bone || !bone.parent) continue;
      // The distal bone has no child in the normalized skeleton (the fingertip
      // node only exists on the raw one), so its rest direction is taken as the
      // continuation of its own offset from its parent -- the same direction
      // the rig's bind pose gives that segment.
      const childBone = k < 2 ? getBone(prefix + ch.bones[k + 1]) : null;
      if (k < 2 && !childBone) continue;
      const a = lms[ch.lm[k]], b = lms[ch.lm[k + 1]];
      if (!a || !b) continue;
      const target = bodyPointToYUp(b).sub(bodyPointToYUp(a));
      if (!(target.lengthSq() > 1e-12)) continue; // also rejects NaN
      target.normalize();
      bone.parent.getWorldQuaternion(parentQ);
      target.applyQuaternion(parentQ.invert());
      const dRest = (childBone ? childBone.position : bone.position).clone().normalize();
      bone.quaternion.setFromUnitVectors(dRest, target);
    }
  }
}


const ARM_CHAIN = [
  { bone: "rightUpperArm", fromIdx: 12, toIdx: 14 },
  { bone: "rightLowerArm", fromIdx: 14, toIdx: 16 },
  { bone: "leftUpperArm", fromIdx: 11, toIdx: 13 },
  { bone: "leftLowerArm", fromIdx: 13, toIdx: 15 },
];
let armRest = null;
function captureArmRest() {
  vrm.scene.updateMatrixWorld(true);
  armRest = {};
  for (const { bone: boneName } of ARM_CHAIN) {
    const bone = getBone(boneName);
    if (!bone) continue;
    const childName = boneName.includes("Upper") ? boneName.replace("Upper", "Lower") : boneName.replace("LowerArm", "Hand");
    const child = getBone(childName);
    if (!child) continue;
    const bonePos = new THREE.Vector3(), childPos = new THREE.Vector3();
    bone.getWorldPosition(bonePos);
    child.getWorldPosition(childPos);
    const worldDir = childPos.clone().sub(bonePos).normalize();
    const worldQuat = new THREE.Quaternion();
    bone.getWorldQuaternion(worldQuat);
    armRest[boneName] = { worldDir, worldQuat };
  }
}

const AXIS_SIGN_MODES = {
  ppp: (x, y, z) => new THREE.Vector3(x, y, z),
  npp: (x, y, z) => new THREE.Vector3(-x, y, z),
  pnp: (x, y, z) => new THREE.Vector3(x, -y, z),
  ppn: (x, y, z) => new THREE.Vector3(x, y, -z),
  nnp: (x, y, z) => new THREE.Vector3(-x, -y, z),
  npn: (x, y, z) => new THREE.Vector3(-x, y, -z),
  pnn: (x, y, z) => new THREE.Vector3(x, -y, -z),
  nnn: (x, y, z) => new THREE.Vector3(-x, -y, -z),
};
const POSE_AXIS_MODE = "pnn";
function bodyPointToYUp(pt) {
  const [x, y, z] = pt;
  return AXIS_SIGN_MODES[POSE_AXIS_MODE](x, y, z);
}

// --- Shoulder-width proportion correction (2026-10-03) -------------------
// Measured directly: this avatar's shoulder width is only ~65% of the real
// signer's recorded shoulder width (0.217 vs 0.334), while arm segment
// lengths are 87-90% (upperArm 0.220 vs 0.245, lowerArm 0.215 vs 0.248) --
// a much bigger proportion gap for width specifically. The arm retarget
// below is swing-only (direction match, fixed pivot/bone-length), so it
// reproduces the real signer's ANGLE exactly -- but the same angle, swept
// from this avatar's narrower shoulder separation, places the hand closer
// to the body midline (and, for some gestures, inside the torso mesh) than
// it was on the real, wider-shouldered signer. Confirmed directly: at the
// "A" word's reported clipping frame, both forearm bones sit literally
// inside the shirt mesh's bounding box; "LOVE" independently showed the
// two palms crossing through each other -- both are downstream of this one
// proportion mismatch, not two separate bugs.
//
// Fix: dampen only the LATERAL (body left-right, X-axis post-"pnn") part of
// each arm segment's observed direction by the measured shoulder-width
// ratio, before normalizing -- vertical reach and forward/depth reach (e.g.
// pointing up, touching the face) are untouched, only the component that
// drives inward/across-body motion is scaled down to match what this
// avatar's narrower torso can accommodate without the arm entering it.
// Applied uniformly to both arm-chain segments (upper arm, forearm) on
// both sides, since cumulative lateral reach down the whole chain is what
// produces both reported symptoms.
const ARM_FORWARD_LIFT = 0.18;
const ARM_LATERAL_SCALE = 0.651; // avatarShoulderWidth / realShoulderWidth, measured

function applyPose(bodyFrame) {
  if (!bodyFrame || !bodyFrame.landmarks_world || !armRest) return false;
  const raw = bodyFrame.landmarks_world;
  let anyApplied = false;
  for (const { bone: boneName, fromIdx, toIdx } of ARM_CHAIN) {
    const rest = armRest[boneName];
    const bone = getBone(boneName);
    if (!rest || !bone) continue;
    const fromPt = raw[fromIdx], toPt = raw[toIdx];
    if (!fromPt || !toPt) continue;
    const a = bodyPointToYUp(fromPt), b = bodyPointToYUp(toPt);
    const diff = b.clone().sub(a);
    diff.x *= ARM_LATERAL_SCALE;
    const observedDir = diff.normalize();
    // (2026-10-05, AK: "DH can use a little more lift") Arms reaching toward the
    // camera read lower on screen than in the recording; tilt forward-pointing
    // segments up a little. Zero for arms hanging/pointing sideways or down.
    observedDir.y += ARM_FORWARD_LIFT * Math.max(0, observedDir.z);
    observedDir.normalize();
    if (observedDir.lengthSq() < 1e-8) continue;
    const delta = new THREE.Quaternion().setFromUnitVectors(rest.worldDir, observedDir);
    const newWorldQuat = delta.clone().multiply(rest.worldQuat);
    const parent = bone.parent;
    const parentWorldQuat = new THREE.Quaternion();
    if (parent) parent.getWorldQuaternion(parentWorldQuat);
    const localQuat = parentWorldQuat.clone().invert().multiply(newWorldQuat);
    bone.quaternion.copy(localQuat);
    bone.updateMatrixWorld(true);
    anyApplied = true;
  }
  return anyApplied;
}

function headCorrectionQuat() { return new THREE.Quaternion(); } // "none" mode, matches production
function applyHead(faceFrame) {
  if (!faceFrame || !faceFrame.transform) return false;
  const m = faceFrame.transform;
  const colMajor = [
    m[0], m[4], m[8], m[12],
    m[1], m[5], m[9], m[13],
    m[2], m[6], m[10], m[14],
    m[3], m[7], m[11], m[15],
  ];
  const mat = new THREE.Matrix4().fromArray(colMajor);
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
  mat.decompose(pos, quat, scl);
  quat.premultiply(headCorrectionQuat());
  const head = getBone("head");
  if (head) head.quaternion.copy(quat);
  return true;
}

const EXPR_MAP = [
  ["jawOpen", "aa", 1.0],
  ["mouthPucker", "ou", 1.3],
  ["mouthFunnel", "oh", 0.8],
  ["mouthSmileLeft", "happy", 0.5],
  ["mouthSmileRight", "happy", 0.5],
  ["eyeBlinkLeft", "blinkLeft", 1.0],
  ["eyeBlinkRight", "blinkRight", 1.0],
  ["browInnerUp", "surprised", 0.6],
];
function applyFace(faceFrame) {
  if (!faceFrame || !faceFrame.blendshapes || !vrm.expressionManager) return false;
  const bs = faceFrame.blendshapes;
  const em = vrm.expressionManager;
  for (const name of em.expressions.map((e) => e.expressionName)) em.setValue(name, 0);
  for (const [bsName, exprName, scale] of EXPR_MAP) {
    const v = bs[bsName];
    if (v == null) continue;
    const cur = em.getValue(exprName) || 0;
    em.setValue(exprName, Math.min(1, cur + v * scale));
  }
  return true;
}

// --- Position-clearance pipeline, rebuilt as a general geometric system
// (2026-10-03, second pass) ------------------------------------------------
// The two per-reference-point nudges this replaces (a fixed-radius blend
// around the HEAD bone, and a separate one around the CHEST bone) each only
// generalized to the one gesture they were tuned against: the chest-based
// elbow nudge cleared "A" (a chest-height gesture) but measurably failed on
// "DON'T MOVE." (resting hand at HIP height -- distance to the chest bone
// alone put it past the blend radius, so the nudge undershot: forearm
// stayed at z=0.041, still inside the shorts/shirt box's z range of
// -0.109..0.114). A single fixed reference point can't represent clearance
// correctly across the whole torso height. Replaced with a DIRECT
// containment+exact-solve approach: build one combined clothing bounding
// box (shirt + shorts, which together span the whole torso/hip silhouette)
// ONCE at load, and every frame, for every arm bone that might clip into
// it, check real X/Y containment and solve exactly for the Z push needed to
// clear the box's front surface -- this generalizes to any height along
// the torso by construction, rather than needing a tuned reference point
// and radius per body region.
//
// Each clearance step ADDS to the bone's CURRENT position (not reset-from-
// rest) so multiple clearance checks compose on the same bone (e.g. a hand
// can need both head-volume clearance AND torso-box clearance in the same
// frame) without one undoing the other.
const CLOTHING_CLEARANCE_MARGIN = 0.02; // meters beyond the mesh's own surface
let clothingClearanceBox = null; // world-space AABB, shirt UNION shorts, computed once at load
function computeClothingClearanceBox() {
  let box = null;
  vrm.scene.traverse((obj) => {
    if (obj.name === "Body_2" || obj.name === "Body_4") { // shorts, shirt -- the torso/hip silhouette
      obj.geometry.computeBoundingBox();
      const bb = obj.geometry.boundingBox.clone();
      bb.applyMatrix4(obj.matrixWorld);
      if (!box) box = bb.clone();
      else box.union(bb);
    }
  });
  clothingClearanceBox = box;
}

// Pushes `rawBone` forward in WORLD +Z until it reaches `targetWorldZ`,
// converting the needed world-space delta into the bone's local space (so
// it composes correctly regardless of the bone's current parent-chain
// orientation). No-ops if the bone is already at or past the target.
function pushBoneToWorldZ(rawBone, targetWorldZ) {
  rawBone.updateMatrixWorld(true);
  const worldPos = new THREE.Vector3();
  rawBone.getWorldPosition(worldPos);
  if (worldPos.z >= targetWorldZ) return;
  const neededDeltaZ = targetWorldZ - worldPos.z;
  const parent = rawBone.parent;
  const parentWorldQuat = new THREE.Quaternion();
  if (parent) parent.getWorldQuaternion(parentWorldQuat);
  const localDelta = new THREE.Vector3(0, 0, neededDeltaZ)
    .applyQuaternion(parentWorldQuat.clone().invert());
  rawBone.position.add(localDelta);
  rawBone.updateMatrixWorld(true);
}

// If `rawBone`'s current world position is within the clothing box's X/Y
// footprint, push it forward just enough to clear the box's front (+Z)
// surface plus a small margin. Only tests X/Y containment (not a full 3D
// point-in-box test against Z) because the whole point is to correct bones
// that are BEHIND the surface in Z while still over the torso/hip in X/Y --
// a bone already in front needs no correction and this is a no-op for it.
function clearClothingBox(rawBone, weight = 1) {
  if (!clothingClearanceBox) return;
  rawBone.updateMatrixWorld(true);
  const worldPos = new THREE.Vector3();
  rawBone.getWorldPosition(worldPos);
  const box = clothingClearanceBox;
  const insideXY = worldPos.x > box.min.x && worldPos.x < box.max.x &&
                   worldPos.y > box.min.y && worldPos.y < box.max.y;
  if (!insideXY) return;
  const target = box.max.z + CLOTHING_CLEARANCE_MARGIN;
  // weight < 1 pushes only part of the way (used to ease off the shoulder push)
  pushBoneToWorldZ(rawBone, worldPos.z >= target ? worldPos.z : worldPos.z + (target - worldPos.z) * weight);
}
// (2026-10-05) The shoulder joint used to be pushed to the shirt's front surface
// (~17.7 cm toward the camera) on EVERY gesture frame, translating the whole arm
// forward even when the arm was already in front of the torso (e.g. hand raised
// to the head, as in "A"), which stretched the shoulder and made forearms look
// too steep/low. Now the shoulder is pushed only by the least amount that gets
// the elbow and hand clear of the shirt: unchanged for arms hanging at the sides
// (elbow behind the shirt front), none for arms already reaching forward or held
// above the shirt.
function shoulderPushAmount(elbowRaw, handRaw) {
  if (!clothingClearanceBox) return 0;
  const box = clothingClearanceBox;
  const target = box.max.z + CLOTHING_CLEARANCE_MARGIN;
  let need = 0;
  const p = new THREE.Vector3();
  for (const b of [elbowRaw, handRaw]) {
    if (!b) continue;
    b.updateMatrixWorld(true);
    b.getWorldPosition(p);
    // soft box edges (0.06 m) so the push eases in/out instead of snapping
    const wx = smooth01((p.x - box.min.x) / 0.06) * smooth01((box.max.x - p.x) / 0.06);
    const wy = smooth01((p.y - box.min.y) / 0.06) * smooth01((box.max.y - p.y) / 0.06);
    if (p.z < target) need = Math.max(need, (target - p.z) * wx * wy);
  }
  return need;
}

// Head/hair clearance, kept as the same distance-to-head blend validated
// against "A" (the hair mesh isn't a box, so a radius-based blend around
// the head bone is still the right shape of fix for THIS volume) -- but

// --- Hand-to-hand separation guard (2026-10-03) ---------------------------
// AK's "HELP" report: fingers visibly pass through the other hand's palm
// when both hands come together. Root cause isn't torso clearance -- it's
// the two Hand bones ending up close enough that this avatar's (fixed-size)
// hand meshes overlap more than the real signer's did. Rather than try to
// model actual hand-mesh collision (expensive, and not worth it for a
// sample/placeholder avatar), enforce a minimum center-to-center distance
// between the two Hand bones: if they're closer than a hand-width-ish
// threshold, push both apart symmetrically along the line between them.
// This still lets gestures have hands close/touching (most of the
// threshold is smaller than a resting gesture would naturally separate
// them) -- it only intervenes when they'd otherwise overlap enough for
// fingers to visibly cross through the opposite palm.
const MIN_HAND_SEPARATION = 0.075; // meters -- approx. this avatar's own palm half-width
function applyHandSeparation() {
  const leftRaw = vrm.humanoid.getRawBoneNode("leftHand");
  const rightRaw = vrm.humanoid.getRawBoneNode("rightHand");
  if (!leftRaw || !rightRaw) return;
  leftRaw.updateMatrixWorld(true);
  rightRaw.updateMatrixWorld(true);
  const leftPos = new THREE.Vector3(); leftRaw.getWorldPosition(leftPos);
  const rightPos = new THREE.Vector3(); rightRaw.getWorldPosition(rightPos);
  const diff = leftPos.clone().sub(rightPos);
  const dist = diff.length();
  if (dist >= MIN_HAND_SEPARATION || dist < 1e-6) return;
  const push = (MIN_HAND_SEPARATION - dist) / 2;
  const dir = diff.normalize();
  const applyPush = (rawBone, worldDir) => {
    const parent = rawBone.parent;
    const parentWorldQuat = new THREE.Quaternion();
    if (parent) parent.getWorldQuaternion(parentWorldQuat);
    const localDelta = worldDir.clone().multiplyScalar(push)
      .applyQuaternion(parentWorldQuat.clone().invert());
    rawBone.position.add(localDelta);
    rawBone.updateMatrixWorld(true);
  };
  applyPush(leftRaw, dir);
  applyPush(rightRaw, dir.clone().negate());
}

// --- New for this tool: library-aware hand-source mapping ---------------
// Production index.html only ever played dh_library entries, where
// `landmarks` is always the DH hand and the project's established
// convention (DH -> VRM "right" bones, NDH -> VRM "left" bones, see
// index.html's ARM_CHAIN comment) was hard-coded directly into setFrame().
// Reviewing the FULL library surfaces two cases that convention doesn't
// cover and would silently render backwards if left hard-coded:
//   - ndh_library entries (e.g. "QUICK"): the SIGNING hand is the NDH hand,
//     and its data lives in the `landmarks` field (confirmed directly
//     against the "QUICK" entry's schema) -- so for these, `landmarks`
//     must drive the LEFT (NDH) bones, and `incidental_opposite_landmarks`
//     (the incidental DH hand) drives the RIGHT bones -- the reverse of
//     dh_library.
//   - head_library entries (e.g. "DON'T WANT", "YES"): there is no
//     `landmarks` / `incidental_opposite_landmarks` at all -- only
//     `incidental_dh_landmarks` and `incidental_ndh_landmarks` (neither
//     hand is the primary signal; the word is carried by head motion).
function getHandSources(lib, e) {
  if (lib === "ndh_library") return { right: e.incidental_opposite_landmarks || null, left: e.landmarks || null };
  if (lib === "head_library") return { right: e.incidental_dh_landmarks || null, left: e.incidental_ndh_landmarks || null };
  return { right: e.landmarks || null, left: e.incidental_opposite_landmarks || null }; // dh_library (and default)
}

// --- Idle liveliness layer (2026-10-04, AK: add blink/breathing/"3d feel"
// without changing the avatar's appearance; verbatim from index.html) ----
// Three effects, all driven by wall-clock time (not gesture-frame index)
// so they keep animating whether a gesture is actively playing or the
// avatar is just sitting idle between words/sentences:
//   1. Blink: this model exposes a standalone "blink" expression, separate
//      from "blinkLeft"/"blinkRight" (which applyFace() drives from the
//      signer's own captured face data) -- using the separate channel
//      means idle blinking never fights with real per-gesture blink data.
//   2. Breathing: a small rotation on the "chest" bone. Confirmed nothing
//      else in this file ever touches "chest" (ARM_CHAIN only drives the
//      arm bones; body pose isn't wired to any torso bone), so this owns
//      it outright with zero contention.
//   3. Gaze drift: uses three-vrm's built-in VRMLookAt (this model has
//      leftEye/rightEye bones + an autoUpdate VRMLookAt instance already),
//      pointed at a small invisible target placed roughly where the
//      camera is -- so the resting gaze reads as "looking at the viewer" --
//      with a slow natural saccade-and-hold wander on top, rather than a
//      continuous mechanical sweep.
// Applied from two call sites that never run in the same tick (see
// idleHeartbeatTick()'s comment for why that's safe): inside setFrame(),
// so it rides along with every real gesture-frame render; and from a
// standalone heartbeat loop that only acts when setFrame() hasn't run
// recently, so the idle layer still animates even before any word has
// ever been played.

// between calls -- found during testing that this matters: a ~260ms blink
// pulse evaluated against raw wall-clock deltas can fall entirely inside a
// single gap between two ticks (confirmed happening under this sandbox's
// known headless rAF throttling, see project notes) and never show up at
// all. Capping the per-call step means a slow tick just plays the blink in

// instead of distance.

// vrm.update(delta) also drives three-vrm's own spring-bone (cloth/hair
// jiggle) physics, which integrates using whatever delta it's given -- it
// has no way to know real time from a hardcoded number. Every call site
// here used to pass a fixed 0.016 (an assumed 60fps frame), which is fine
// when ticks genuinely arrive every ~16ms, but badly wrong whenever they
// don't: the spring-bone solver then "thinks" far less wall-clock time
// has passed than really has, and visibly lags behind the skeleton's
// actual pose (verbatim fix from index.html/sentence.html -- see their
// comments for the full story). Computing the real elapsed time each
// call keeps the physics in sync with wall-clock time regardless of how
// fast ticks actually arrive. Clamped so a long gap (e.g. the tab was
// backgrounded) doesn't feed the solver one huge delta and make
// cloth/hair jump.
let lastVrmUpdateAt = performance.now();
function vrmUpdateRealDelta() {
  const now = performance.now();
  const dt = Math.min(0.1, Math.max(0, (now - lastVrmUpdateAt) / 1000));
  lastVrmUpdateAt = now;
  vrm.update(dt);
}

// --- Hand dropout fill + relaxed hand (2026-10-05, AK review round 2) --------
// (a) MediaPipe loses the hand for a few frames when it is occluded (e.g. a fist
// at the forehead). applyHand() then keeps the last valid orientation while the
// arm keeps moving, so the hand lags/looks wrong ("DH needs more lift", frame
// 4335: 5-frame dropout). Short gaps (<= HAND_GAP_MAX frames) that have valid

    const arr = e[key];

    // pointing at the camera collapses in the recorded landmarks (wrist->middle-

    // sometimes come back depth-mirrored: all four fingers then curl toward the BACK
    // of the hand, which is anatomically impossible. Measured over all 38 gold
    // entries: DH finger curl (relative to the palm normal) is never strongly
    // negative except in WHY (24% of frames) and WHO (4%); NDH has the opposite
    // sign convention. For such frames reflect the finger/thumb points through the
    // palm plane, so the curl goes toward the palm. Palm orientation is unchanged.

// --- Symmetric rest arms (2026-10-05, AK: "NDH longer than DH in rest pose") ---
// The rest pose is captured from the recording's first frame, so each arm hangs
// the way THAT signer's arm happened to hang (measured: NDH hand 5.4 cm lower
// than DH, fingertips ~10 cm lower). The DH (right) arm is the natural-looking
// one, so the left upper/lower arm are set to its mirror image (reflection across
// the body's left-right plane: q -> (x, -y, -z, w); valid because normalized
// VRM bones share one world-aligned rest frame). Rotation only; hands/fingers,
// gesture playback and the arm retarget are untouched.
function symmetrizeRestArms() {
  poseNeutralRef();
  for (const part of ["UpperArm", "LowerArm"]) {
    const src = getBone("right" + part), dst = getBone("left" + part);
    if (!src || !dst) continue;
    const q = src.quaternion;
    dst.quaternion.set(q.x, -q.y, -q.z, q.w);
  }
  // Hand + fingers too: the left (NDH) hand is mirrored from the right so an
  // unposed NDH hand rests in a natural relaxed shape instead of a twisted one.
  relaxedHand.Right = {}; relaxedHand.Left = {};
  for (const n of HAND_CHAIN_BONES) {
    const src = getBone("right" + n), dst = getBone("left" + n);
    if (!src || !dst) continue;
    const q = src.quaternion;
    dst.quaternion.set(q.x, -q.y, -q.z, q.w);
    relaxedHand.Right[n] = src.quaternion.clone();
    relaxedHand.Left[n] = dst.quaternion.clone();
  }
  vrm.scene.updateMatrixWorld(true);
}
function captureRestPoseRawQuats() {
  symmetrizeRestArms();
  vrm.update(0.001); // sync the mirrored normalized bones onto the raw skeleton before capturing
  restPoseRawQuat = {};
  for (const name of REST_POSE_BONE_NAMES) {
    const b = vrm.humanoid.getRawBoneNode(name);
    if (b) restPoseRawQuat[name] = b.quaternion.clone();
  }
  // The sleeve/hair spring-bone joints (VRMSpringBoneManager -- this model
  // has 57, including J_Sec_R_TopsUpperArmInside/Outside for the sleeves)
  // are NOT part of the humanoid skeleton, so nothing above touches them --
  // they're purely physics-driven, chasing whatever their parent bone
  // (e.g. rightUpperArm) does. three-vrm records each joint's "initial"
  // local rotation exactly once, right after the model loads (while the
  // skeleton is still in its T-pose-ish bind state), and that's the only
  // state .reset() can snap back to. Settle the physics into the new
  // pose with a burst of small fixed-size steps first -- a single tick
  // only nudges the sleeve one small step away from wherever it WAS, so
  // capturing the init state too early bakes in a still-mid-swing,
  // flared-out configuration as "rest" (confirmed on index.html/
  // sentence.html -- see their comments for the full story). THEN
  // capture a fresh init state, with the skeleton posed to the real
  // rest reference and the sleeve already hanging naturally, so a later
  // reset() snaps back to exactly how it looks right now.
  for (let i = 0; i < 150; i++) vrm.update(0.02);
  if (vrm.springBoneManager) vrm.springBoneManager.setInitState();
}
function applyRestPose() {
  if (!restPoseRawQuat) return;
  for (const name of REST_POSE_BONE_NAMES) {
    const q = restPoseRawQuat[name];
    const b = q && vrm.humanoid.getRawBoneNode(name);
    if (b) b.quaternion.copy(q);
  }
  for (const side of ["Left", "Right"]) {
    const s = side.toLowerCase();
    const upperArm = vrm.humanoid.getRawBoneNode(s + "UpperArm");
    if (upperArm && upperArmRestLocalPos[side]) upperArm.position.copy(upperArmRestLocalPos[side]);
    const lowerArm = vrm.humanoid.getRawBoneNode(s + "LowerArm");
    if (lowerArm && lowerArmRestLocalPos[side]) lowerArm.position.copy(lowerArmRestLocalPos[side]);
    const hand = vrm.humanoid.getRawBoneNode(s + "Hand");
    if (hand && handRestLocalPos[side]) hand.position.copy(handRestLocalPos[side]);
  }
  // The sleeve spring joints' parent is an aim-constraint bone that
  // tracks the arm's rotation -- re-run the constraint pass so it's in
  // sync with the just-reset arm before anything reads its matrix (see
  // index.html/sentence.html for the full story).
  if (vrm.nodeConstraintManager) vrm.nodeConstraintManager.update();
  // Spring-bone reset() reads each joint's PARENT world matrix live --
  // without a forced recompute it's stale (reflects the last render, not
  // the rotations just written above), which was making reset() snap
  // sleeves to the wrong place (see index.html/sentence.html for the
  // full story).
  vrm.scene.updateMatrixWorld(true);
  // Snap the sleeve/hair spring bones back to the rest-pose init state
  // captured above, instead of leaving them to (maybe never) physically
  // settle there on their own.
  if (vrm.springBoneManager) vrm.springBoneManager.reset();
}
let showRestPose = true;

// Heartbeat: only acts when setFrame() hasn't rendered in the last 50ms --
// i.e. only during genuine idle stretches (before the first word is ever
// played, or between words/sentences). The moment real playback resumes,
// setFrame() marks window.__lastSetFrameAt itself and this backs off, so
// only one code path is ever driving vrm.update()/render() at a time --
// no dual-loop race, no flicker.
function idleHeartbeatTick() {
  const now = performance.now();
  if (now - (window.__lastSetFrameAt || 0) > 50) {
    applyIdleLayer(now - idleStartTime);
    vrmUpdateRealDelta();
    if (showRestPose) applyRestPose();
    renderer.render(scene, camera);
    requestAnimationFrame(idleHeartbeatTick);
  } else {
    // Actively playing right now, so this tick has nothing to do -- but
    // re-registering via requestAnimationFrame anyway would still claim a
    // rAF slot every single frame, competing with the playback loop's own
    // rAF registration for the browser's per-frame rAF budget purely for
    // the sake of an empty no-op. Back off to an infrequent timer check
    // instead while playback owns the frame; resume the tight rAF loop
    // the moment we're idle again.
    setTimeout(idleHeartbeatTick, 100);
  }
}

window.setFrame = function (i) {
  if (!entry) return;
  window.__lastSetFrameAt = performance.now();
  showRestPose = false;
  const n = entry.frame_ids.length;
  const idx = Math.max(0, Math.min(n - 1, i));
  const hands = getHandSources(curLibrary, entry);
  applyPose(entry.body ? entry.body[idx] : null);
  applyHand(hands.right ? hands.right[idx] : null, "Right");
  applyHand(hands.left ? hands.left[idx] : null, "Left");
  if (!handHasData(hands.left)) applyRelaxedHand("Left");
  if (!handHasData(hands.right)) applyRelaxedHand("Right");
  applyHead(entry.face ? entry.face[idx] : null);
  applyFace(entry.face ? entry.face[idx] : null);
  applyIdleLayer(performance.now() - idleStartTime);
  vrmUpdateRealDelta();
  applyPositionClearance("Left");
  applyPositionClearance("Right");
  applyHandSeparation();
  renderer.render(scene, camera);
};

async function initVrm() {
  const gltf = await loader.loadAsync("/models/sample.vrm");
  vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  captureArmRest();
  captureHandRest();
  computeClothingClearanceBox();
  const leftHandRawBone = vrm.humanoid.getRawBoneNode("leftHand");
  if (leftHandRawBone) handRestLocalPos.Left = leftHandRawBone.position.clone();
  const rightHandRawBone = vrm.humanoid.getRawBoneNode("rightHand");
  if (rightHandRawBone) handRestLocalPos.Right = rightHandRawBone.position.clone();
  const leftLowerArmRawBone = vrm.humanoid.getRawBoneNode("leftLowerArm");
  if (leftLowerArmRawBone) lowerArmRestLocalPos.Left = leftLowerArmRawBone.position.clone();
  const rightLowerArmRawBone = vrm.humanoid.getRawBoneNode("rightLowerArm");
  if (rightLowerArmRawBone) lowerArmRestLocalPos.Right = rightLowerArmRawBone.position.clone();
  const leftUpperArmRawBone = vrm.humanoid.getRawBoneNode("leftUpperArm");
  if (leftUpperArmRawBone) upperArmRestLocalPos.Left = leftUpperArmRawBone.position.clone();
  const rightUpperArmRawBone = vrm.humanoid.getRawBoneNode("rightUpperArm");
  if (rightUpperArmRawBone) upperArmRestLocalPos.Right = rightUpperArmRawBone.position.clone();
  setupGazeTarget();
  // DEBUG ONLY (diagnostic session): expose internals for Playwright measurement scripts.
  window.__vrm = vrm;
  window.getBone = getBone;
  window.THREE = THREE;
  window.__entry = () => entry;
  window.__frameCount = () => (entry ? entry.frame_ids.length : 0);
  window.__loadEntryDirect = async (library, word, index) => {
    const res = await fetch(`/api/gold/instance?library=${encodeURIComponent(library)}&word=${encodeURIComponent(word)}&index=${index}`);
    entry = fillEntryHandGaps(await res.json());
    curLibrary = library;
    lastHandLocalQuat = { Right: null, Left: null };
    window.setFrame(0);
  };
}

// --- Review UI ------------------------------------------------------------
let SUMMARY = null;   // { libraries: {dh_library:{word:[...]}, ...}, gold: {word:{...}} }
let curWord = null;
let curLib = null;
let curInstances = [];

const LIB_LABEL = { dh_library: "Dominant hand", ndh_library: "Non-dominant hand", head_library: "Head movement" };

function totalWordCount() {
  let n = 0;
  for (const lib of Object.values(SUMMARY.libraries)) n += Object.keys(lib).length;
  return n;
}
function updateProgress() {
  const marked = Object.keys(SUMMARY.gold).length;
  document.getElementById("progress").textContent = `${marked} / ${totalWordCount()} marked`;
}

function populateWordSelect() {
  const sel = document.getElementById("wordSelect");
  sel.innerHTML = "";
  for (const libName of ["dh_library", "ndh_library", "head_library"]) {
    const words = SUMMARY.libraries[libName];
    if (!words) continue;
    const grp = document.createElement("optgroup");
    grp.label = LIB_LABEL[libName];
    for (const word of Object.keys(words).sort()) {
      const opt = document.createElement("option");
      opt.value = JSON.stringify({ lib: libName, word });
      const isGold = !!SUMMARY.gold[word];
      opt.textContent = (isGold ? "★ " : "") + word;
      grp.appendChild(opt);
    }
    sel.appendChild(grp);
  }
}

function populateInstanceSelect() {
  const sel = document.getElementById("instanceSelect");
  sel.innerHTML = "";
  const gold = SUMMARY.gold[curWord];
  // Best-completeness-first, so the first thing AK looks at is usually
  // already a good candidate -- still just a sort, never a decision.
  const sorted = [...curInstances].sort((a, b) => (b.completeness || 0) - (a.completeness || 0));
  for (const inst of sorted) {
    const opt = document.createElement("option");
    opt.value = String(inst.index);
    const isGold = gold && gold.signer_id === inst.signer_id && gold.session_id === inst.session_id && gold.utterance_id === inst.utterance_id;
    opt.textContent = `${isGold ? "★ " : ""}${inst.signer_id} / ${inst.session_id} / ${inst.utterance_id} — ${inst.frames}f — ${inst.completeness == null ? "?" : inst.completeness + "%"}`;
    if (isGold) opt.selected = true;
    sel.appendChild(opt);
  }
}

async function loadInstance(index) {
  const res = await fetch(`/api/gold/instance?library=${encodeURIComponent(curLib)}&word=${encodeURIComponent(curWord)}&index=${index}`);
  entry = fillEntryHandGaps(await res.json());
  curLibrary = curLib;
  lastHandLocalQuat = { Right: null, Left: null };
  const n = entry.frame_ids.length;
  const slider = document.getElementById("frameSlider");
  slider.max = Math.max(0, n - 1);
  slider.value = 0;
  pause();
  curFrame = 0;
  window.setFrame(0);
  updateFrameLabel();
}

function updateFrameLabel() {
  const n = entry ? entry.frame_ids.length : 0;
  document.getElementById("frameLabel").textContent = `${curFrame} / ${Math.max(0, n - 1)}`;
}

let playing = false, rafId = null, lastT = 0, curFrame = 0;
const FRAME_MS = 20;
function tick(t) {
  if (!playing) return;
  if (t - lastT >= FRAME_MS) {
    lastT = t;
    const n = entry.frame_ids.length;
    curFrame = (curFrame + 1) % n;
    window.setFrame(curFrame);
    document.getElementById("frameSlider").value = curFrame;
    updateFrameLabel();
  }
  rafId = requestAnimationFrame(tick);
}
function play() {
  if (playing || !entry) return;
  playing = true;
  document.getElementById("playBtn").textContent = "Pause";
  lastT = 0;
  rafId = requestAnimationFrame(tick);
}
function pause() {
  playing = false;
  document.getElementById("playBtn").textContent = "Play";
  if (rafId) cancelAnimationFrame(rafId);
  showRestPose = true;
}

function setStatus(msg) {
  document.getElementById("statusLine").textContent = msg;
}

async function onWordChange() {
  const { lib, word } = JSON.parse(document.getElementById("wordSelect").value);
  curLib = lib;
  curWord = word;
  curInstances = SUMMARY.libraries[lib][word];
  populateInstanceSelect();
  const sel = document.getElementById("instanceSelect");
  await loadInstance(Number(sel.value));
  setStatus("");
}

async function onInstanceChange() {
  const sel = document.getElementById("instanceSelect");
  await loadInstance(Number(sel.value));
}

async function onMark() {
  const inst = curInstances.find((i) => String(i.index) === document.getElementById("instanceSelect").value);
  if (!inst) return;
  const res = await fetch("/api/gold/mark", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      word: curWord,
      library: curLib,
      signer_id: inst.signer_id,
      session_id: inst.session_id,
      utterance_id: inst.utterance_id,
    }),
  });
  const data = await res.json();
  if (!res.ok) { setStatus("Error: " + data.error); return; }
  SUMMARY.gold = data.gold;
  populateWordSelect();
  // Re-select the word we were just on (populateWordSelect rebuilds options).
  selectWordInDropdown(curLib, curWord);
  populateInstanceSelect();
  updateProgress();
  setStatus(`Marked gold for "${curWord}": ${inst.signer_id}/${inst.session_id}/${inst.utterance_id}`);
}

async function onClear() {
  const res = await fetch("/api/gold/mark", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ word: curWord, clear: true }),
  });
  const data = await res.json();
  if (!res.ok) { setStatus("Error: " + data.error); return; }
  SUMMARY.gold = data.gold;
  populateWordSelect();
  selectWordInDropdown(curLib, curWord);
  populateInstanceSelect();
  updateProgress();
  setStatus(`Cleared gold pick for "${curWord}"`);
}

function selectWordInDropdown(lib, word) {
  const sel = document.getElementById("wordSelect");
  for (const opt of sel.options) {
    const v = JSON.parse(opt.value);
    if (v.lib === lib && v.word === word) { opt.selected = true; break; }
  }
}

async function initUi() {
  const res = await fetch("/api/gold/summary");
  SUMMARY = await res.json();
  populateWordSelect();
  updateProgress();

  document.getElementById("wordSelect").addEventListener("change", onWordChange);
  document.getElementById("instanceSelect").addEventListener("change", onInstanceChange);
  document.getElementById("markBtn").addEventListener("click", onMark);
  document.getElementById("clearBtn").addEventListener("click", onClear);
  document.getElementById("playBtn").addEventListener("click", () => (playing ? pause() : play()));
  document.getElementById("frameSlider").addEventListener("input", () => {
    pause();
    curFrame = Number(document.getElementById("frameSlider").value);
    window.setFrame(curFrame);
    updateFrameLabel();
  });

  await onWordChange(); // load the first word/instance
  // Captured HERE (after a real gesture frame has been posed), not right
  // after model load -- see the "Rest-pose restore" comment above
  // setFrame() for why that matters.
  await ensureNeutralRef();
  captureRestPoseRawQuats();
  if (entry) window.setFrame(0); // show the loaded instance's first frame, as before
  requestAnimationFrame(idleHeartbeatTick);
}

(async function init() {
  await initVrm();
  await initUi();
})().catch((e) => {
  setStatus("Init error: " + String((e && e.stack) || e));
  console.error(e);
});
</script>
</body>
