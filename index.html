<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ISL Sign Player</title>
<style>
  html, body {
    margin:0; padding:0; overflow:hidden; height:100%;
    background: linear-gradient(180deg, #f7ecda 0%, #f0ddc3 55%, #dcbd9c 100%);
  }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/",
    "@pixiv/three-vrm": "./vendor/pixiv/three-vrm.module.js",
    "kalidokit": "./vendor/kalidokit/kalidokit.es.js"
  }
}
</script>
</head>
<body>
<!-- Playback UI (2026-10-03): entry picker + play/pause/scrub, so this can be
     watched directly in a browser instead of only stepped frame-by-frame via
     the console (which is all setFrame() gave you before). Add "&ui=0" to
     the URL to hide this for clean automated/headless screenshots. -->
<div id="ui" style="position:fixed; top:8px; left:8px; z-index:10; font:13px/1.4 sans-serif; background:rgba(255,255,255,0.88); padding:8px 10px; border-radius:6px; display:flex; align-items:center; gap:8px;">
  <select id="entrySelect"></select>
  <button id="playBtn">Play</button>
  <input id="frameSlider" type="range" min="0" max="0" value="0" style="width:180px; vertical-align:middle;">
  <span id="frameLabel">0 / 0</span>
  <a href="sentence.html" style="font-size:12px; margin-left:4px;">Sentence playback &rarr;</a>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
import * as Kalidokit from "kalidokit";

const W = 900, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setClearColor(0xf0ddc3, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Homely backdrop (2026-10-04, AK: "add some background, that should appear
// like a homely setting"). A simple warm vertical gradient -- no external
// image assets to source/host, keeps this self-contained in the shipped
// HTML like everything else here. Colors match the page's own CSS gradient
// (see <style> above) so the canvas edge doesn't show a seam against the
// page background behind it.
function makeHomelyBackground() {
  const c = document.createElement("canvas");
  c.width = 2; c.height = 256;
  const ctx = c.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#f7ecda");
  grad.addColorStop(0.55, "#f0ddc3");
  grad.addColorStop(1, "#dcbd9c");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 2, 256);
  return new THREE.CanvasTexture(c);
}
scene.background = makeHomelyBackground();
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 20);
camera.position.set(0, 1.35, 2.2);
camera.lookAt(0, 1.2, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(1, 2, 2);
scene.add(dir);

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));

let vrm = null;
let entry = null;

window.__debug = {};
window.__scene = scene;
window.__camera = camera;
window.__renderer = renderer;
window.__ready = false;
window.THREE = THREE;
window.Kalidokit = Kalidokit;
window.camera = camera;

function getBone(name) {
  return vrm.humanoid.getNormalizedBoneNode(name);
}
window.getBone = getBone;
window.__vrmUpdate = () => vrm.update(0.016);

// Kalidokit hand-key -> VRM bone-name (unprefixed) mapping.
// Thumb: Kalidokit's 3 values (Proximal/Intermediate/Distal) map onto VRM's
// 3 thumb bones (Metacarpal/Proximal/Distal) shifted by one slot -- this is
// the standard community mapping for kalidokit+VRM (VRM has no
// "thumbIntermediate" bone; see humanoid.md spec).
const HAND_BONE_MAP = {
  Wrist: "Hand",
  ThumbProximal: "ThumbMetacarpal",
  ThumbIntermediate: "ThumbProximal",
  ThumbDistal: "ThumbDistal",
  IndexProximal: "IndexProximal",
  IndexIntermediate: "IndexIntermediate",
  IndexDistal: "IndexDistal",
  MiddleProximal: "MiddleProximal",
  MiddleIntermediate: "MiddleIntermediate",
  MiddleDistal: "MiddleDistal",
  RingProximal: "RingProximal",
  RingIntermediate: "RingIntermediate",
  RingDistal: "RingDistal",
  LittleProximal: "LittleProximal",
  LittleIntermediate: "LittleIntermediate",
  LittleDistal: "LittleDistal",
};
window.HAND_BONE_MAP = HAND_BONE_MAP;

// --- Hand finger-curl/wrist history (2026-10-02) ---
// Several abandoned approaches were tried here and have been removed:
// (1) whole-wrist axis-aligned roll corrections, (2) a thumb-only sign
// sweep, (3) a 180-about-index-axis "rip and replace" hack (AK correctly
// flagged this one as breaking the other fingers' anatomical order), and
// (4) a geometric swing+twist wrist-basis fit driven by index/thumb
// landmark directions. None of these were needed.
// ROOT CAUSE (found via AK's annotated screenshot showing fingers curling
// backward over the top of the hand instead of into the palm): Kalidokit's
// finger-curl Euler values were being applied with the wrong sign for this
// VRM rig's bone-local axes, so every finger flexed AWAY from the palm
// instead of into it -- which alone explains both "thumb at bottom" and
// "fingers in reverse order" (a hand curling the wrong way looks mirrored).
// Fix: negate all 3 Euler axes for finger-curl bones only. Kalidokit's own
// native Wrist value needs no correction at all once this is fixed --
// verified numerically and visually across 6 sampled frames.

// ROOT CAUSE FOUND (2026-10-02, AK's "fingers bending opposite way to palm"
// report + annotated image confirming it): Kalidokit's finger-curl Euler
// values (Proximal/Intermediate/Distal, all on the local Z axis for every
// non-thumb finger) were being applied with the WRONG SIGN for this VRM
// rig's bone-local axis convention, so every finger flexed BACKWARD (over
// the back of the hand, away from the palm) instead of curling INTO the
// palm. This produced exactly the two symptoms AK reported from two
// different angles: the overall hand silhouette looked "reversed" (back-
// of-hand curl reads as a mirror image of palm-side curl) and the thumb
// ended up appearing at the bottom instead of the top.
// Verified by isolating JUST the finger-curl bones (wrist frozen at its
// bind-pose relationship to the forearm) and rendering from the side: with
// the raw Kalidokit sign, fingers arced up and back over the top of the
// hand (confirmed wrong -- AK annotated this exact render with "Fingers
// should bend this way" pointing the opposite direction); negating all
// three Euler axes made them curl forward/down into a natural fist
// instead, matching AK's annotation exactly.
// With the curl direction fixed, Kalidokit's own native Wrist value (no
// correction needed at all) already produces the correct anatomical
// finger order (thumb, index, middle, ring, pinky) and thumb-at-top
// orientation AK asked for -- checked numerically (fingertip bone
// positions) and visually across 6 sampled frames (0/10/20/30/40/53). The
// earlier geometric swing+twist wrist fit this file had is no longer
// needed and has been removed; the actual bug was the curl sign, not the
// wrist.
// --- Geometric wrist/palm orientation (2026-10-03) --------------------
// SUPERSEDES the "native Kalidokit Wrist value, unmodified" conclusion
// above. That conclusion was only ever checked against the "I" gesture.
// Checked against "WAIT" (AK's flat-open-palm reference frame, both
// hands) it broke down: DH's palm faced AWAY from the camera (back of
// hand toward camera) and WATCH/STOP showed the same downward-bent-wrist
// symptom AK flagged ("entire palm from wrist is bent downwards rather
// than up... elbow buried into torso"). Root cause: Kalidokit's wrist
// Euler is a library-internal estimate, not something this project ever
// derived from or validated against the actual recorded landmark
// geometry -- unlike the arm chain, which IS driven that way.
//
// Fix uses the exact same principle as the ARM_CHAIN retarget below, just
// extended from one direction vector (swing-only) to two (swing+twist),
// since the hand's palm-facing direction is a second, independent degree
// of freedom a single "point this way" vector can't capture:
//   forward    = wrist(0) -> middleMcp(9)      (which way the hand points)
//   palmNormal = (indexMcp(5)-wrist) x (pinkyMcp(17)-wrist)  (which way the palm faces)
// Both captured once from the VRM rig's own bone geometry at true bind
// pose (captureHandRest(), called alongside captureArmRest() in init()),
// and recomputed every frame from the real landmark data converted
// through the SAME bodyPointToYUp used for the arm chain (verified
// numerically: hand landmarks use the identical "pnn" convention -- the
// arm chain's elbow->wrist direction and this wrist's own forward vector
// agree frame-to-frame once converted this way). The two bases are each
// turned into an orthonormal quaternion (Gram-Schmidt) and the delta
// between them is applied as a world-space rotation on top of the
// captured rest world quaternion, converted to the Hand bone's local
// space via the parent's CURRENT world quaternion -- identical technique
// to applyPose()'s ARM_CHAIN loop. For this to use the CURRENT frame's
// forearm orientation (not the previous frame's), applyPose() must run
// BEFORE applyHand() -- see the reordered calls in setFrame().
// Verified across all 4 entries (I/WATCH/STOP/WAIT), both hands: WAIT's
// DH+NDH now both read palm-toward-camera as AK's reference shows, and
// WATCH/STOP's previously-flagged downward wrist bend is gone (palms now
// visibly face forward/each other with fingers spread, matching AK's
// STOP reference: "palm facing forward, 4 fingers pointing up"). No
// regression on "I" (unaffected gesture shape, hand stays mostly hidden
// at frame 0 and forms the same thumb-out fist near the chest at later
// frames). Does NOT touch finger curl (separate, lower-priority
// DH/NDH-asymmetry issue, see HandSolver's internal `invert` factor).
let handRest = null; // { Right: {worldQuat, forward, normal}, Left: {...} }

// Smoothing state for the geometric wrist fit (2026-10-03 follow-up): AK
// reported the wrist fix introduced visible jitter across ALL FOUR entries
// (not isolated to one gesture), where the previous Kalidokit-native-Wrist
// render had none. Measured directly, not guessed: comparing frame-to-frame
// WORLD-orientation deltas of the Hand bone, the new geometric fit averages
// ~3-4 degrees/frame (STOP/WATCH/WAIT) vs. the old native-Euler approach's
// ~2-2.5 degrees/frame on the same (already-posed) arm -- roughly double,
// consistent with AK's report. Root cause: the geometric fit derives the
// wrist's full orientation from only 2 vectors built out of 4 raw landmarks
// (wrist/indexMcp/middleMcp/pinkyMcp) every single frame, with no smoothing
// at all -- ordinary MediaPipe per-frame landmark noise (well-documented
// elsewhere in this project, e.g. the "thin tape wavering" investigations)
// propagates directly into the basis fit. This is a real, separate issue
// from the orientation fix itself being correct -- the fix's directional
// accuracy (confirmed against WAIT/STOP/WATCH reference photos) is not in
// question, only its frame-to-frame smoothness.
// Fix: a light, one-pole low-pass filter (quaternion slerp) on the Hand
// bone's LOCAL rotation, applied AFTER computing the geometric target each
// frame -- same "hold + blend toward new target" philosophy already proven
// in this project's other thread for exactly this class of problem
// (Kalidokit/VRM project status log, 2026-10-02, "smoothHandTransition").
// alpha=0.4 was chosen by directly measuring frame-to-frame WORLD-delta
// mean/max/std across all 4 entries at several alpha values and picking the
// smallest alpha (most smoothing) that still tracked fast real motion
// without visible lag: at 0.4-0.45, "I" drops from (mean 3.0/max 10.2) to
// (~2.6/~7), "STOP" from (4.1/10.5) to (~3.2/~8) -- back in the same range
// as the old native-Euler baseline's smoothness, without needing to revert
// the orientation fix itself. Smoothing is in LOCAL space (relative to the
// forearm) since that's the value this code directly controls each frame;
// a missing-landmark frame leaves both this state AND the bone untouched
// (existing hold-last-valid behavior), so resuming after a gap naturally
// blends from whatever was last actually applied -- no special-casing
// needed for gaps.
const WRIST_SMOOTHING_ALPHA = 0.4;
let lastHandLocalQuat = { Right: null, Left: null };
function captureHandRest() {
  vrm.scene.updateMatrixWorld(true);
  handRest = {};
  for (const side of ["Right", "Left"]) {
    const p = side.toLowerCase();
    const hand = getBone(p + "Hand");
    const middleProx = getBone(p + "MiddleProximal");
    const indexProx = getBone(p + "IndexProximal");
    const littleProx = getBone(p + "LittleProximal");
    if (!hand || !middleProx || !indexProx || !littleProx) continue;
    const handPos = new THREE.Vector3(); hand.getWorldPosition(handPos);
    const midPos = new THREE.Vector3(); middleProx.getWorldPosition(midPos);
    const idxPos = new THREE.Vector3(); indexProx.getWorldPosition(idxPos);
    const ltlPos = new THREE.Vector3(); littleProx.getWorldPosition(ltlPos);
    const forward = midPos.clone().sub(handPos).normalize();
    const normal = idxPos.clone().sub(handPos).cross(ltlPos.clone().sub(handPos)).normalize();
    const worldQuat = new THREE.Quaternion();
    hand.getWorldQuaternion(worldQuat);
    handRest[side] = { worldQuat, forward, normal };
  }
}

// Gram-Schmidt: build an orthonormal-frame quaternion from a primary
// direction (becomes local +X) and a secondary direction used only to
// fix the twist about that axis (becomes, after orthogonalizing, local
// +Y; +Z is their cross product).
function basisQuatFromVectors(primary, secondary) {
  const x = primary.clone().normalize();
  let z = x.clone().cross(secondary).normalize();
  if (z.lengthSq() < 1e-6) z = x.clone().cross(new THREE.Vector3(0, 1, 0)).normalize();
  const y = z.clone().cross(x).normalize();
  const m = new THREE.Matrix4().makeBasis(x, y, z);
  return new THREE.Quaternion().setFromRotationMatrix(m);
}

function applyHand(landmarks21, side /* "Right" | "Left" */) {
  if (!landmarks21) return false;
  const lm = landmarks21.map(([x, y, z]) => ({ x, y, z }));
  const solved = Kalidokit.Hand.solve(lm, side);
  if (!solved) return false;
  for (const [kKey, vrmSuffix] of Object.entries(HAND_BONE_MAP)) {
    const val = solved[side + kKey];
    if (!val) continue;
    const boneName = side.toLowerCase() + vrmSuffix; // e.g. "rightThumbMetacarpal"
    const bone = getBone(boneName);
    if (!bone) continue;
    if (kKey === "Wrist") {
      const rest = handRest && handRest[side];
      if (rest && landmarks21.length >= 18) {
        const wrist = bodyPointToYUp(landmarks21[0]);
        const middleMcp = bodyPointToYUp(landmarks21[9]);
        const indexMcp = bodyPointToYUp(landmarks21[5]);
        const pinkyMcp = bodyPointToYUp(landmarks21[17]);
        const obsForward = middleMcp.clone().sub(wrist).normalize();
        const obsNormal = indexMcp.clone().sub(wrist).cross(pinkyMcp.clone().sub(wrist)).normalize();
        const restBasisQuat = basisQuatFromVectors(rest.forward, rest.normal);
        const obsBasisQuat = basisQuatFromVectors(obsForward, obsNormal);
        const delta = obsBasisQuat.clone().multiply(restBasisQuat.clone().invert());
        const newWorldQuat = delta.clone().multiply(rest.worldQuat);
        const parent = bone.parent;
        const parentWorldQuat = new THREE.Quaternion();
        if (parent) parent.getWorldQuaternion(parentWorldQuat);
        let localQuat = parentWorldQuat.clone().invert().multiply(newWorldQuat);
        const lastLocal = lastHandLocalQuat[side];
        if (lastLocal) localQuat = lastLocal.clone().slerp(localQuat, WRIST_SMOOTHING_ALPHA);
        bone.quaternion.copy(localQuat);
        lastHandLocalQuat[side] = localQuat.clone();
      } else {
        // Fallback (rest not captured yet, or malformed landmark data):
        // native Kalidokit value, same as this project used before. Reset
        // the smoothing state so the geometric path doesn't slerp across
        // this unrelated discontinuity on the next good frame.
        const e = new THREE.Euler(val.x || 0, val.y || 0, val.z || 0, "XYZ");
        bone.quaternion.setFromEuler(e);
        lastHandLocalQuat[side] = null;
      }
    } else {
      // Finger curl: negate all axes to flip flexion direction into the palm.
      const e = new THREE.Euler(-(val.x || 0), -(val.y || 0), -(val.z || 0), "XYZ");
      bone.quaternion.setFromEuler(e);
    }
  }
  return true;
}

// --- Direct geometric arm retarget -----------------------------------
// Kalidokit's built-in PoseSolver (calcArms) turned out to be calibrated
// for a different MediaPipe world-landmark sign convention than this
// project's own Tasks-API PoseLandmarker output -- tried all 8 axis-sign
// combinations against the real resting frame and none produced a
// plausible arms-down pose (see Phase 1 write-up). Rather than keep
// guessing at Kalidokit's internal convention, this reuses the SAME
// "rotation from a captured rest direction to the observed direction"
// principle this project's own hand_retarget_geometric.py already
// validated repeatedly for hands -- rotation/scale-invariant, and it
// only needs this data's OWN internal consistency (Y-down, confirmed
// numerically), not a match to Kalidokit's assumed convention.
// PREVIOUS FIX, NOW REVERTED (AK review, 2026-10-02): an earlier bug report
// ("right and left hand interchanged") was fixed by swapping this chain so
// the confirmed-moving body landmarks (12/14/16, MediaPipe's "right_*")
// drove VRM's "left*" bones. That swap was made while the scene still had
// the incorrect `vrm.scene.rotation.y = Math.PI` flip (see init()), which
// made the avatar face AWAY from the camera -- under that wrong setup, the
// screen-side mapping really was backwards, and the swap "fixed" the
// visible symptom. Now that the root 180 has been removed and the avatar
// actually faces the camera, the correct mapping is the ORIGINAL,
// un-swapped one: a character facing the camera shows its own right side
// on the viewer's LEFT (face-to-face mirroring, like two people looking at
// each other) -- so the real right arm/hand (the confirmed-moving DH side)
// belongs on VRM's "right*" bones, which render on screen-left, matching
// AK's reference photo (real signer's moving elbow on screen-left). Landmark
// 16 ("right_wrist") is still the confirmed-moving side (checked
// numerically: range ~0.16 vs ~0.02 for landmark 15 on the two largest
// axes, correlating with the DH hand data's own wrist motion ~0.11-0.20) --
// only which VRM bones it drives has changed back.
const ARM_CHAIN = [
  { bone: "rightUpperArm", fromIdx: 12, toIdx: 14 }, // right_shoulder -> right_elbow (confirmed moving side)
  { bone: "rightLowerArm", fromIdx: 14, toIdx: 16 }, // right_elbow -> right_wrist (confirmed moving side)
  { bone: "leftUpperArm", fromIdx: 11, toIdx: 13 },
  { bone: "leftLowerArm", fromIdx: 13, toIdx: 15 },
];
let armRest = null; // populated at init: { boneName: { worldQuat, worldDir, restAcrossWorld? } }

function captureArmRest() {
  vrm.scene.updateMatrixWorld(true);
  armRest = {};
  for (const { bone: boneName, fromIdx, toIdx } of ARM_CHAIN) {
    const bone = getBone(boneName);
    if (!bone) continue;
    const childName = boneName.includes("Upper") ? boneName.replace("Upper", "Lower") : boneName.replace("LowerArm", "Hand");
    const child = getBone(childName);
    if (!child) continue;
    const bonePos = new THREE.Vector3(), childPos = new THREE.Vector3();
    bone.getWorldPosition(bonePos);
    child.getWorldPosition(childPos);
    const worldDir = childPos.clone().sub(bonePos).normalize();
    const worldQuat = new THREE.Quaternion();
    bone.getWorldQuaternion(worldQuat);
    armRest[boneName] = { worldDir, worldQuat };
  }
}

// Sign-mode table for converting raw MediaPipe-space direction vectors into
// the Y-up frame this renderer's bone math uses. Kept as a named table
// (rather than inlining the winning formula) so a future mismatch can be
// re-swept the same way this one was -- see bodyPointToYUp's comment below
// for how "pnn" was chosen.
const AXIS_SIGN_MODES = {
  ppp: (x, y, z) => new THREE.Vector3(x, y, z),
  npp: (x, y, z) => new THREE.Vector3(-x, y, z),
  pnp: (x, y, z) => new THREE.Vector3(x, -y, z),
  ppn: (x, y, z) => new THREE.Vector3(x, y, -z),
  nnp: (x, y, z) => new THREE.Vector3(-x, -y, z),
  npn: (x, y, z) => new THREE.Vector3(-x, y, -z),
  pnn: (x, y, z) => new THREE.Vector3(x, -y, -z),
  nnn: (x, y, z) => new THREE.Vector3(-x, -y, -z),
};
window.AXIS_SIGN_MODES = AXIS_SIGN_MODES;

// This project's body-landmark Y convention was confirmed numerically
// (nose_y << hip_y) to be Y-DOWN, same as MediaPipe's image-landmark
// convention -- that part is solid, independent of everything below.
//
// RE-DERIVED (AK review, 2026-10-02): the previous "xyz_flip verified
// correct" conclusion here was reached while `vrm.scene.rotation.y =
// Math.PI` was ALSO being applied in init() -- a line now found to be
// simply wrong (the model faces the camera natively, zero rotation
// needed; see init()'s comment). AK's own diagnosis: every 180-ish fix
// found in this file, including this one, was very likely compensating
// for that one upstream error rather than an independent bug -- confirmed
// here. Re-swept all 8 sign combinations fresh (not just the old biased
// set that always pre-negated Y) against the corrected scene AND the
// reverted ARM_CHAIN mapping (see its comment above): "pnn" (negate Y and
// Z, leave X alone) is the only one that gives both a natural arms-at-sides
// rest pose at frame 0 and a smooth, coherent elbow-bend rise to the chest
// across the full 54-frame clip (checked at 0/10/20/30/40/53, not just two
// spot frames). Notably this is the SAME formula as the original
// pre-scene-rotation-bug "yz_flip" guess from the very first Phase 1
// attempt -- further evidence the simplest convention was right all along
// and every subsequent correction was chasing the scene-rotation bug's
// shadow, not a real independent issue.
// A forearm-TWIST correction (derived from real hand-landmark "palm width"
// vectors, isolated from swing via Gram-Schmidt) was built and tested here
// to address AK's "palm orientation wrong, thumb towards body" report,
// under the hypothesis that swing-only retargeting leaves twist genuinely
// undetermined (true in general, and the real cause of this same symptom
// in the project's Blender/Pose2Sim pipeline, §8). Swept 8 axis-sign
// conventions for the hand-landmark vectors and NONE produced a correct
// result -- because the actual cause here was upstream (the scene-rotation
// bug below), not a missing twist DOF. Once that root cause was fixed, the
// thumb was correctly visible from camera with swing-only retargeting and
// NO twist correction at all. Removed rather than left disabled, to avoid
// this exact dead end being retried the same way next time.
window.__poseAxisMode = "pnn";
function bodyPointToYUp(pt) {
  const [x, y, z] = pt;
  return AXIS_SIGN_MODES[window.__poseAxisMode](x, y, z);
}

// --- Shoulder-width proportion correction (2026-10-03) -------------------
// Measured directly: this avatar's shoulder width is only ~65% of the real
// signer's recorded shoulder width (0.217 vs 0.334), while arm segment
// lengths are 87-90% (upperArm 0.220 vs 0.245, lowerArm 0.215 vs 0.248) --
// a much bigger proportion gap for width specifically. The arm retarget
// below is swing-only (direction match, fixed pivot/bone-length), so it
// reproduces the real signer's ANGLE exactly -- but the same angle, swept
// from this avatar's narrower shoulder separation, places the hand closer
// to the body midline (and, for some gestures, inside the torso mesh) than
// it was on the real, wider-shouldered signer. Confirmed directly via
// AK's gold-review pass: "A" showed the forearm sitting inside the shirt
// mesh's bounding box; "LOVE" showed the two palms crossing through each
// other -- both downstream of this one proportion mismatch.
//
// Fix: dampen only the LATERAL (body left-right, X-axis post-"pnn") part of
// each arm segment's observed direction by the measured shoulder-width
// ratio, before normalizing -- vertical and forward/depth reach (e.g.
// pointing up, touching the face) are untouched, only the component that
// drives inward/across-body motion is scaled down. Verified: LOVE's
// closest hand-to-hand distance improved from 0.070m to 0.110m (57% more
// clearance) with this change alone.
const ARM_LATERAL_SCALE = 0.651; // avatarShoulderWidth / realShoulderWidth, measured

// REVERTED (2026-10-03): the "FOLLOW-UP CORRECTION" that used to live here
// (a per-bone Y/Z swap applied only to rightLowerArm, on the claim that
// plain "pnn" didn't reach high enough) was checked directly against the
// real recorded wrist position -- not just against how one render looked --
// and found to be flatly wrong. Converting the real shoulder->wrist landmark
// vector with plain "pnn" and comparing it to the real landmark-derived
// wrist position gives a near-exact direction match (verified across 9
// frames spanning "I", "STOP!" and "WATCH": e.g. real=[0.21,-0.45,0.87] vs
// plain-pnn=[0.22,-0.44,0.87]), while this swap's resulting direction was
// wildly off in every single one of those frames, sometimes with the wrong
// SIGN on an axis entirely (e.g. WATCH: real Y=-0.42, swap Y=+0.17). It had
// been accepted the day before based on how one frame of "I LOVE YOU"
// looked, without checking it against the actual recorded motion -- it
// coincidentally looked plausible for that one case while pointing the
// forearm in a direction unrelated to the real data. The forward-nudge and
// chest-point wrist corrections built on top of it (both removed below)
// were compensating for ITS consequences, not independent problems. Uniform
// "pnn" (bodyPointToYUp, used directly in ARM_CHAIN below with no per-bone
// override) is what the data actually supports.

function applyPose(bodyFrame) {
  if (!bodyFrame || !bodyFrame.landmarks_world || !armRest) return false;
  const raw = bodyFrame.landmarks_world;
  let anyApplied = false;
  for (const { bone: boneName, fromIdx, toIdx } of ARM_CHAIN) {
    const rest = armRest[boneName];
    const bone = getBone(boneName);
    if (!rest || !bone) continue;
    const fromPt = raw[fromIdx], toPt = raw[toIdx];
    if (!fromPt || !toPt) continue;
    const a = bodyPointToYUp(fromPt), b = bodyPointToYUp(toPt);
    const diff = b.clone().sub(a);
    diff.x *= ARM_LATERAL_SCALE;
    const observedDir = diff.normalize();
    if (observedDir.lengthSq() < 1e-8) continue;

    const delta = new THREE.Quaternion().setFromUnitVectors(rest.worldDir, observedDir);
    const newWorldQuat = delta.clone().multiply(rest.worldQuat);

    // local = parentWorldQuat^-1 * newWorldQuat ; get current parent world
    // quat fresh each time since the upper-arm bone (lowerArm's parent)
    // may already have been rotated earlier in this same loop.
    const parent = bone.parent;
    const parentWorldQuat = new THREE.Quaternion();
    if (parent) parent.getWorldQuaternion(parentWorldQuat);
    const localQuat = parentWorldQuat.clone().invert().multiply(newWorldQuat);
    bone.quaternion.copy(localQuat);
    bone.updateMatrixWorld(true);
    anyApplied = true;
  }
  return anyApplied;
}

// MediaPipe FaceLandmarker's facial_transformation_matrix is documented as
// row-major. THREE.Matrix4.fromArray expects column-major, so transpose.
// Re-derived (2026-10-02) after removing the incorrect scene.rotation.y
// flip in init(): swept none/x180/y180/z180/xz180/xy180 fresh and found
// "none" (no correction at all) puts the head right-side-up and
// forward-facing at frame 0 -- the old "y180" finding was itself just
// another downstream consequence of the removed scene-rotation bug.
window.__headCorrectionMode = "none";
function headCorrectionQuat(mode) {
  const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
  const q = (axis, rad) => new THREE.Quaternion().setFromAxisAngle(axis, rad);
  switch (mode) {
    case "x180": return q(X, Math.PI);
    case "y180": return q(Y, Math.PI);
    case "z180": return q(Z, Math.PI);
    case "xz180": return q(X, Math.PI).multiply(q(Z, Math.PI));
    case "xy180": return q(X, Math.PI).multiply(q(Y, Math.PI));
    default: return new THREE.Quaternion();
  }
}
function applyHead(faceFrame) {
  if (!faceFrame || !faceFrame.transform) return false;
  const m = faceFrame.transform; // 16 floats, row-major
  const colMajor = [
    m[0], m[4], m[8], m[12],
    m[1], m[5], m[9], m[13],
    m[2], m[6], m[10], m[14],
    m[3], m[7], m[11], m[15],
  ];
  const mat = new THREE.Matrix4().fromArray(colMajor);
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
  mat.decompose(pos, quat, scl);
  const correction = headCorrectionQuat(window.__headCorrectionMode);
  quat.premultiply(correction);
  const head = getBone("head");
  if (head) head.quaternion.copy(quat);
  window.__debug.headQuat = quat.toArray();
  return true;
}

const EXPR_MAP = [
  ["jawOpen", "aa", 1.0],
  ["mouthPucker", "ou", 1.3],
  ["mouthFunnel", "oh", 0.8],
  ["mouthSmileLeft", "happy", 0.5],
  ["mouthSmileRight", "happy", 0.5],
  ["eyeBlinkLeft", "blinkLeft", 1.0],
  ["eyeBlinkRight", "blinkRight", 1.0],
  ["browInnerUp", "surprised", 0.6],
];

function applyFace(faceFrame) {
  if (!faceFrame || !faceFrame.blendshapes || !vrm.expressionManager) return false;
  const bs = faceFrame.blendshapes;
  const em = vrm.expressionManager;
  for (const name of em.expressions.map((e) => e.expressionName)) {
    em.setValue(name, 0);
  }
  for (const [bsName, exprName, scale] of EXPR_MAP) {
    const v = bs[bsName];
    if (v == null) continue;
    const cur = em.getValue(exprName) || 0;
    em.setValue(exprName, Math.min(1, cur + v * scale));
  }
  return true;
}

// Non-dominant (left) hand forward nudge (2026-10-02, AK: "left hand just
// needs to be in front, orientation is correct, buried behind the dress /
// torso"). The left arm's SWING-only retarget is correctly oriented, but
// since it's not independently driven at the hand (no DH data for the NDH
// side at these frames -- see ARM_CHAIN/applyHand comments), its resting
// position sits close enough to the torso's own mesh surface to clip into
// it. Not an orientation/data problem (AK confirmed), just the forearm
// chain passing slightly behind the torso's surface instead of in front of
// it, so this nudges the Hand bone's position (not its rotation) a fixed
// amount toward the camera (+Z, the direction the avatar faces -- see the
// camera setup above) to clear the torso mesh, while leaving every bone's
// orientation exactly as computed.
// IMPORTANT (found while testing this fix): three-vrm's "normalized" bone
// proxies (what getBone()/getNormalizedBoneNode returns, used everywhere
// else in this file) only have their ROTATION synced onto the actual raw
// skeleton bones by vrm.update() -- position changes on a normalized bone
// are silently dropped (confirmed directly: after setting the normalized
// leftHand's position and calling vrm.update(), the RAW bone's world
// position was unchanged, off by exactly the attempted offset). So this
// nudge must target the RAW bone (getRawBoneNode), and must be applied
// AFTER vrm.update() runs, or vrm.update() has nothing to overwrite it with
// anyway (it never touches raw position) -- applying it before or after
// works equally for position, but after is used here to keep it next to the
// render call, away from the rotation-driving code above.
// UPDATED (2026-10-03): generalized from a single fixed 6cm left-hand-only
// nudge (tuned only for torso clearance) to a distance-to-head-aware blend
// applied to BOTH hands. AK's gold-review pass across the full 38-word
// library surfaced a case ("A") where the fixed 6cm offset was not enough
// to clear the head/hair mesh -- the NDH hand's fingers visually blended
// into the hair near the head. A single bigger constant would have
// overshot normal torso-level poses, pushing hands too far forward there,
// so the offset now ramps up (via THREE.MathUtils.lerp on a clamped
// head-distance ratio) only as a hand's rest position approaches the head
// bone; at normal torso-level distance it reduces to the original 6cm.
// Verified in gold_review.html: "A" (the reported clipping case) now
// renders with a visible gap to the hair, and "WAIT" (an existing
// validated torso-level reference) shows no regression.
// --- General geometric clearance system (2026-10-03, REPLACES the old ---
// --- per-reference-point distance-blend hand/elbow nudges above) ---------
// AK's broader testing found the previous chest-distance-blend forearm
// nudge (tuned against "A", a chest-height gesture) did NOT generalize to
// hip-level gestures like "DON'T MOVE." (measured: the old nudge gave only
// ~4cm offset there, not enough to clear the shorts/shirt mesh at that body
// height) -- and separately, "HELP" showed fingers passing through the
// opposite palm, a different interpenetration entirely (hand-to-hand, not
// arm-to-torso). Per AK's explicit instruction to fix the general CLASS of
// bugs rather than keep patching individual words, this replaces the old
// heuristics with two general mechanisms:
//   1. A world-space AABB (shirt UNION shorts) computed once at load. Every
//      frame, for every arm bone that might clip into it, test real X/Y
//      containment and solve EXACTLY for the Z push needed to clear the
//      box's front surface -- this generalizes to any height along the
//      torso by construction, not just the one height it was tuned against.
//   2. A minimum center-to-center distance enforced between the two Hand
//      bones, pushing both apart symmetrically when violated -- addresses
//      finger-through-palm crossing independent of the torso-box fix.
// Each clearance step ADDS to the bone's CURRENT position (reset to its
// captured rest local position first, same as the old nudges) so multiple
// checks compose on the same bone (e.g. a hand needs both head-volume AND
// torso-box clearance in the same frame) without one undoing the other.
// Verified in gold_review.html across all 7 of: A, LOVE, DON'T MOVE., HELP
// (the two newly-reported failures, both now visually confirmed fixed),
// plus WAIT/WATCH/STOP! (previously-validated references, no regression).
const CLOTHING_CLEARANCE_MARGIN = 0.02; // meters beyond the mesh's own surface
let clothingClearanceBox = null; // world-space AABB, shirt UNION shorts, computed once at load
function computeClothingClearanceBox() {
  let box = null;
  vrm.scene.traverse((obj) => {
    if (obj.name === "Body_2" || obj.name === "Body_4") { // shorts, shirt -- the torso/hip silhouette
      obj.geometry.computeBoundingBox();
      const bb = obj.geometry.boundingBox.clone();
      bb.applyMatrix4(obj.matrixWorld);
      if (!box) box = bb.clone();
      else box.union(bb);
    }
  });
  clothingClearanceBox = box;
}

// Pushes `rawBone` forward in WORLD +Z until it reaches `targetWorldZ`,
// converting the needed world-space delta into the bone's local space (so
// it composes correctly regardless of the bone's current parent-chain
// orientation). No-ops if the bone is already at or past the target.
function pushBoneToWorldZ(rawBone, targetWorldZ) {
  rawBone.updateMatrixWorld(true);
  const worldPos = new THREE.Vector3();
  rawBone.getWorldPosition(worldPos);
  if (worldPos.z >= targetWorldZ) return;
  const neededDeltaZ = targetWorldZ - worldPos.z;
  const parent = rawBone.parent;
  const parentWorldQuat = new THREE.Quaternion();
  if (parent) parent.getWorldQuaternion(parentWorldQuat);
  const localDelta = new THREE.Vector3(0, 0, neededDeltaZ)
    .applyQuaternion(parentWorldQuat.clone().invert());
  rawBone.position.add(localDelta);
  rawBone.updateMatrixWorld(true);
}

// If `rawBone`'s current world position is within the clothing box's X/Y
// footprint, push it forward just enough to clear the box's front (+Z)
// surface plus a small margin. Only tests X/Y containment (not a full 3D
// point-in-box test against Z) because the whole point is to correct bones
// that are BEHIND the surface in Z while still over the torso/hip in X/Y --
// a bone already in front needs no correction and this is a no-op for it.
function clearClothingBox(rawBone) {
  if (!clothingClearanceBox) return;
  rawBone.updateMatrixWorld(true);
  const worldPos = new THREE.Vector3();
  rawBone.getWorldPosition(worldPos);
  const box = clothingClearanceBox;
  const insideXY = worldPos.x > box.min.x && worldPos.x < box.max.x &&
                   worldPos.y > box.min.y && worldPos.y < box.max.y;
  if (insideXY) pushBoneToWorldZ(rawBone, box.max.z + CLOTHING_CLEARANCE_MARGIN);
}

// Head/hair clearance, kept as the same distance-to-head blend validated
// against "A" (the hair mesh isn't a box, so a radius-based blend around
// the head bone is still the right shape of fix for THIS volume) -- but
// now ADDS to the bone's current position instead of resetting from rest,
// so it composes with clearClothingBox above instead of overwriting it.
const HAND_HEAD_FORWARD_OFFSET = 0.16;   // meters -- clears the hair mesh's volume near the head
const HAND_HEAD_CLEARANCE_RADIUS = 0.30; // meters -- distance at which the blend starts ramping up
function clearHeadVolume(rawBone) {
  const head = getBone("head");
  if (!head) return;
  rawBone.updateMatrixWorld(true);
  const worldPos = new THREE.Vector3();
  rawBone.getWorldPosition(worldPos);
  const headWorldPos = new THREE.Vector3();
  head.getWorldPosition(headWorldPos);
  const d = worldPos.distanceTo(headWorldPos);
  const t = THREE.MathUtils.clamp(1 - d / HAND_HEAD_CLEARANCE_RADIUS, 0, 1);
  if (t <= 0) return;
  const offset = HAND_HEAD_FORWARD_OFFSET * t;
  const parent = rawBone.parent;
  const parentWorldQuat = new THREE.Quaternion();
  if (parent) parent.getWorldQuaternion(parentWorldQuat);
  const localDelta = new THREE.Vector3(0, 0, offset)
    .applyQuaternion(parentWorldQuat.clone().invert());
  rawBone.position.add(localDelta);
  rawBone.updateMatrixWorld(true);
}

// --- Hand-to-hand separation guard (2026-10-03) ---------------------------
// AK's "HELP" report: fingers visibly pass through the other hand's palm
// when both hands come together. Root cause isn't torso clearance -- it's
// the two Hand bones ending up close enough that this avatar's (fixed-size)
// hand meshes overlap more than the real signer's did. Rather than try to
// model actual hand-mesh collision (expensive, and not worth it for a
// sample/placeholder avatar), enforce a minimum center-to-center distance
// between the two Hand bones: if they're closer than a hand-width-ish
// threshold, push both apart symmetrically along the line between them.
// This still lets gestures have hands close/touching (most of the
// threshold is smaller than a resting gesture would naturally separate
// them) -- it only intervenes when they'd otherwise overlap enough for
// fingers to visibly cross through the opposite palm.
const MIN_HAND_SEPARATION = 0.075; // meters -- approx. this avatar's own palm half-width
function applyHandSeparation() {
  const leftRaw = vrm.humanoid.getRawBoneNode("leftHand");
  const rightRaw = vrm.humanoid.getRawBoneNode("rightHand");
  if (!leftRaw || !rightRaw) return;
  leftRaw.updateMatrixWorld(true);
  rightRaw.updateMatrixWorld(true);
  const leftPos = new THREE.Vector3(); leftRaw.getWorldPosition(leftPos);
  const rightPos = new THREE.Vector3(); rightRaw.getWorldPosition(rightPos);
  const diff = leftPos.clone().sub(rightPos);
  const dist = diff.length();
  if (dist >= MIN_HAND_SEPARATION || dist < 1e-6) return;
  const push = (MIN_HAND_SEPARATION - dist) / 2;
  const dir = diff.normalize();
  const applyPush = (rawBone, worldDir) => {
    const parent = rawBone.parent;
    const parentWorldQuat = new THREE.Quaternion();
    if (parent) parent.getWorldQuaternion(parentWorldQuat);
    const localDelta = worldDir.clone().multiplyScalar(push)
      .applyQuaternion(parentWorldQuat.clone().invert());
    rawBone.position.add(localDelta);
    rawBone.updateMatrixWorld(true);
  };
  applyPush(leftRaw, dir);
  applyPush(rightRaw, dir.clone().negate());
}

let handRestLocalPos = { Left: null, Right: null };
let lowerArmRestLocalPos = { Left: null, Right: null };
let upperArmRestLocalPos = { Left: null, Right: null };
function applyPositionClearance(side) {
  const upperArm = vrm.humanoid.getRawBoneNode(side.toLowerCase() + "UpperArm");
  const lowerArm = vrm.humanoid.getRawBoneNode(side.toLowerCase() + "LowerArm");
  const hand = vrm.humanoid.getRawBoneNode(side.toLowerCase() + "Hand");
  if (upperArm && upperArmRestLocalPos[side]) {
    upperArm.position.copy(upperArmRestLocalPos[side]);
    clearClothingBox(upperArm);
  }
  if (lowerArm && lowerArmRestLocalPos[side]) {
    lowerArm.position.copy(lowerArmRestLocalPos[side]);
    clearClothingBox(lowerArm);
  }
  if (hand && handRestLocalPos[side]) {
    hand.position.copy(handRestLocalPos[side]);
    clearClothingBox(hand);
    clearHeadVolume(hand);
  }
}

// REMOVED (2026-10-03): applyRightLowerArmForwardNudge and
// applyRightHandChestPointCorrection used to live here. Both existed only
// to patch consequences of the rightLowerArmSwap bug (the nudge cleared
// clipping caused by the swap's wrong trajectory; the chest-point
// correction force-rolled the wrist to compensate for the swap pointing the
// forearm somewhere the real data never put it). With the swap gone and the
// arm chain using the data-verified uniform conversion, re-checked visually
// across "I", "STOP!" and "WATCH" -- no clipping, no need for either patch.
// If clipping reappears against new data, re-derive a nudge from the
// CORRECTED arm's actual geometry, not by re-adding these old constants.

// --- Idle liveliness layer (2026-10-04, AK: add blink/breathing/"3d feel"
// without changing the avatar's appearance) ------------------------------
// Three effects, all driven by wall-clock time (not gesture-frame index)
// so they keep animating whether a gesture is actively playing or the
// avatar is just sitting idle between words/sentences:
//   1. Blink: this model exposes a standalone "blink" expression, separate
//      from "blinkLeft"/"blinkRight" (which applyFace() drives from the
//      signer's own captured face data) -- using the separate channel
//      means idle blinking never fights with real per-gesture blink data.
//   2. Breathing: a small rotation on the "chest" bone. Confirmed nothing
//      else in this file ever touches "chest" (ARM_CHAIN only drives the
//      arm bones; body pose isn't wired to any torso bone), so this owns
//      it outright with zero contention.
//   3. Gaze drift: uses three-vrm's built-in VRMLookAt (this model has
//      leftEye/rightEye bones + an autoUpdate VRMLookAt instance already),
//      pointed at a small invisible target placed roughly where the
//      camera is -- so the resting gaze reads as "looking at the viewer" --
//      with a slow natural saccade-and-hold wander on top, rather than a
//      continuous mechanical sweep.
// Applied from two call sites that never run in the same tick (see
// idleHeartbeatTick()'s comment for why that's safe): inside setFrame(),
// so it rides along with every real gesture-frame render; and from a
// standalone heartbeat loop that only acts when setFrame() hasn't run
// recently, so the idle layer still animates even before any word has
// ever been played.
let idleBlinkNextAt = 0;
let idleBlinking = false;
let idleBlinkElapsed = 0; // ms progressed within the current blink
let idleBlinkLastT = null;
const IDLE_BLINK_CLOSE_MS = 90, IDLE_BLINK_HOLD_MS = 40, IDLE_BLINK_OPEN_MS = 130;
const IDLE_BLINK_TOTAL_MS = IDLE_BLINK_CLOSE_MS + IDLE_BLINK_HOLD_MS + IDLE_BLINK_OPEN_MS;
// Progress is advanced by a STEP CAPPED AT 40ms per call, not the raw gap
// between calls -- found during testing that this matters: a ~260ms blink
// pulse evaluated against raw wall-clock deltas can fall entirely inside a
// single gap between two ticks (confirmed happening under this sandbox's
// known headless rAF throttling, see project notes) and never show up at
// all. Capping the per-call step means a slow tick just plays the blink in
// slow motion instead of skipping it outright -- same fix shape as the
// clamped head-distance blends elsewhere in this file, applied to time
// instead of distance.
function idleBlinkValue(tMs) {
  if (!idleBlinking) {
    if (tMs < idleBlinkNextAt) return 0;
    idleBlinking = true;
    idleBlinkElapsed = 0;
    idleBlinkLastT = tMs;
  }
  idleBlinkElapsed += Math.min(40, Math.max(0, tMs - idleBlinkLastT));
  idleBlinkLastT = tMs;
  const holdEnd = IDLE_BLINK_CLOSE_MS + IDLE_BLINK_HOLD_MS;
  let v;
  if (idleBlinkElapsed < IDLE_BLINK_CLOSE_MS) v = idleBlinkElapsed / IDLE_BLINK_CLOSE_MS;
  else if (idleBlinkElapsed < holdEnd) v = 1;
  else if (idleBlinkElapsed < IDLE_BLINK_TOTAL_MS) v = 1 - (idleBlinkElapsed - holdEnd) / IDLE_BLINK_OPEN_MS;
  else {
    v = 0;
    idleBlinking = false;
    idleBlinkLastT = null;
    idleBlinkNextAt = tMs + 2500 + Math.random() * 3000; // next blink in 2.5-5.5s
  }
  return Math.max(0, Math.min(1, v));
}

let chestRestQuat = null;
const BREATH_PERIOD_MS = 4200; // ~14 breaths/min, calm resting rate
const BREATH_AMPLITUDE = 0.045; // radians (~2.6 degrees) -- subtle on purpose
function applyBreathing(tMs) {
  const chest = getBone("chest");
  if (!chest) return;
  if (!chestRestQuat) chestRestQuat = chest.quaternion.clone();
  const phase = ((tMs % BREATH_PERIOD_MS) / BREATH_PERIOD_MS) * Math.PI * 2;
  const lift = Math.sin(phase) * BREATH_AMPLITUDE;
  const breathQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-lift * 0.6, 0, lift * 0.25));
  chest.quaternion.copy(chestRestQuat).multiply(breathQuat);
}

let gazeTarget = null;
let gazeCurrentOffset = { x: 0, y: 0 };
let gazeTargetOffset = { x: 0, y: 0 };
let gazeSaccadeFromOffset = { x: 0, y: 0 };
let gazeNextSaccadeAt = 0;
let gazeSaccadeStartedAt = -1;
const GAZE_SACCADE_MS = 220;
const GAZE_CONE = 0.09; // meters of wander at the gaze target's distance
function setupGazeTarget() {
  const head = getBone("head");
  if (!head || !vrm.lookAt) return;
  const headPos = new THREE.Vector3();
  head.getWorldPosition(headPos);
  gazeTarget = new THREE.Object3D();
  gazeTarget.position.set(headPos.x, headPos.y, headPos.z + 1.6); // roughly camera distance, dead ahead
  scene.add(gazeTarget);
  vrm.lookAt.target = gazeTarget;
}
function applyGazeDrift(tMs) {
  if (!gazeTarget) return;
  if (tMs >= gazeNextSaccadeAt && gazeSaccadeStartedAt < 0) {
    gazeSaccadeStartedAt = tMs;
    gazeSaccadeFromOffset = { ...gazeCurrentOffset };
    gazeTargetOffset = {
      x: (Math.random() * 2 - 1) * GAZE_CONE,
      y: (Math.random() * 2 - 1) * GAZE_CONE * 0.6, // eyes wander less vertically
    };
  }
  if (gazeSaccadeStartedAt >= 0) {
    const t = Math.min(1, (tMs - gazeSaccadeStartedAt) / GAZE_SACCADE_MS);
    const eased = t * (2 - t); // ease-out
    gazeCurrentOffset = {
      x: gazeSaccadeFromOffset.x + (gazeTargetOffset.x - gazeSaccadeFromOffset.x) * eased,
      y: gazeSaccadeFromOffset.y + (gazeTargetOffset.y - gazeSaccadeFromOffset.y) * eased,
    };
    if (t >= 1) {
      gazeSaccadeStartedAt = -1;
      gazeNextSaccadeAt = tMs + 1200 + Math.random() * 2800; // next saccade in 1.2-4s
    }
  }
  const head = getBone("head");
  if (!head) return;
  const headPos = new THREE.Vector3();
  head.getWorldPosition(headPos);
  gazeTarget.position.set(headPos.x + gazeCurrentOffset.x, headPos.y + gazeCurrentOffset.y, headPos.z + 1.6);
}

const idleStartTime = performance.now();
function applyIdleLayer(tMs) {
  if (vrm.expressionManager) vrm.expressionManager.setValue("blink", idleBlinkValue(tMs));
  applyBreathing(tMs);
  applyGazeDrift(tMs);
}

// vrm.update(delta) also drives three-vrm's own spring-bone (cloth/hair
// jiggle) physics, which integrates using whatever delta it's given -- it
// has no way to know real time from a hardcoded number. Every call site
// here used to pass a fixed 0.016 (an assumed 60fps frame), which is fine
// when ticks genuinely arrive every ~16ms, but badly wrong whenever they
// don't: the spring-bone solver then "thinks" far less wall-clock time
// has passed than really has, and visibly lags behind the skeleton's
// actual pose -- e.g. a sleeve appearing to hang in the last gesture's
// position for a long stretch after the rest-pose restore has already
// instantly reset every real skeleton bone underneath it (confirmed by
// direct bone inspection on sentence.html: position+rotation matched the
// fresh-load rest values exactly, even while the rendered sleeve still
// looked wrong). Computing the real elapsed time each call keeps the
// physics in sync with wall-clock time regardless of how fast ticks
// actually arrive. Clamped so a long gap (e.g. the tab was backgrounded)
// doesn't feed the solver one huge delta and make cloth/hair jump.
let lastVrmUpdateAt = performance.now();
function vrmUpdateRealDelta() {
  const now = performance.now();
  const dt = Math.min(0.1, Math.max(0, (now - lastVrmUpdateAt) / 1000));
  lastVrmUpdateAt = now;
  vrm.update(dt);
}

// --- Rest-pose restore (2026-10-04, AK: avatar should sit at its natural
// rest pose on load, and return to it after a gesture/sentence finishes --
// not T-pose, and not frozen holding the last handshape) -------------------
// Root cause of both: three-vrm's "normalized" bone proxies start at
// IDENTITY rotation when the model loads -- which, in VRM1's normalized
// bone space, IS the definition of T-pose -- regardless of what the RAW
// skeleton's actual authored rest pose looks like. vrm.update() syncs
// EVERY normalized bone onto its raw counterpart unconditionally, so the
// idle heartbeat's very first vrm.update() call (now firing within ~50ms
// of load, before any gesture has ever played) overwrites the nice
// authored rest pose with identity rotation on every bone nothing has
// touched yet -- visually, T-pose. And since nothing ever restored the
// normalized bones to anything afterwards either, the raw skeleton was
// simply left holding whatever the LAST real gesture frame set, forever.
// CAUGHT WHILE TESTING: capturing the raw skeleton's rotation right after
// the model loads (before posing anything) does NOT give the authored
// rest pose either -- direct inspection showed the raw skeleton is
// ALREADY T-pose-ish at that point, an artifact of three-vrm's own
// humanoid/normalized-bone setup during load, not the GLB's original
// bind pose. So instead, captureRestPoseRawQuats() is called AFTER
// window.setFrame(0) has posed the default entry's first frame (a pose
// already known to look right -- it's what this page showed as its
// default preview before any of this existed) and captures THAT. Then,
// whenever nothing is actively driving a real gesture frame (showRestPose
// === true), those captured raw rotations are re-applied AFTER
// vrm.update() runs each idle tick -- the same "write raw bones directly,
// after vrm.update(), to override what the sync just did" pattern already
// used above for position clearance. Excludes "chest" (owned by
// breathing) and the eye bones (owned by gaze drift) so neither effect
// fights this restore.
const REST_POSE_BONE_NAMES = [
  "hips", "spine", "upperChest", "neck", "head",
  "leftShoulder", "leftUpperArm", "leftLowerArm", "leftHand",
  "leftThumbMetacarpal", "leftThumbProximal", "leftThumbDistal",
  "leftIndexProximal", "leftIndexIntermediate", "leftIndexDistal",
  "leftMiddleProximal", "leftMiddleIntermediate", "leftMiddleDistal",
  "leftRingProximal", "leftRingIntermediate", "leftRingDistal",
  "leftLittleProximal", "leftLittleIntermediate", "leftLittleDistal",
  "rightShoulder", "rightUpperArm", "rightLowerArm", "rightHand",
  "rightThumbMetacarpal", "rightThumbProximal", "rightThumbDistal",
  "rightIndexProximal", "rightIndexIntermediate", "rightIndexDistal",
  "rightMiddleProximal", "rightMiddleIntermediate", "rightMiddleDistal",
  "rightRingProximal", "rightRingIntermediate", "rightRingDistal",
  "rightLittleProximal", "rightLittleIntermediate", "rightLittleDistal",
  "leftUpperLeg", "leftLowerLeg", "leftFoot", "leftToes",
  "rightUpperLeg", "rightLowerLeg", "rightFoot", "rightToes",
];
let restPoseRawQuat = null;
function captureRestPoseRawQuats() {
  restPoseRawQuat = {};
  for (const name of REST_POSE_BONE_NAMES) {
    const b = vrm.humanoid.getRawBoneNode(name);
    if (b) restPoseRawQuat[name] = b.quaternion.clone();
  }
  // The sleeve/hair spring-bone joints (VRMSpringBoneManager -- this model
  // has 57, including J_Sec_R_TopsUpperArmInside/Outside for the sleeves)
  // are NOT part of the humanoid skeleton, so nothing above touches them --
  // they're purely physics-driven, chasing whatever their parent bone
  // (e.g. rightUpperArm) does. three-vrm records each joint's "initial"
  // local rotation exactly once, right after the model loads (while the
  // skeleton is still in its T-pose-ish bind state), and that's the only
  // state .reset() can snap back to. Left as-is, "resetting" a sleeve
  // after a gesture only resets it to that original bind-relative
  // orientation, not to how it looked under THIS rest pose -- and the
  // physics sim has no guarantee of ever settling back to a sane
  // configuration on its own (confirmed: a sleeve can stay visibly
  // wrong for 60+ real seconds after the skeleton itself has already
  // snapped back correctly). Settle the physics into the new pose with
  // a burst of small fixed-size steps first -- a single tick (whatever
  // setFrame(0) just did) only nudges the sleeve one small step away
  // from wherever it WAS (the T-pose-ish bind state), so capturing the
  // init state right after just one tick bakes in a still-mid-swing,
  // flared-out configuration as "rest" (confirmed: that's exactly what
  // happened the first time this skipped the settling step). THEN
  // capture a fresh init state, with the skeleton posed to the real
  // rest reference and the sleeve already hanging naturally, so a later
  // reset() snaps back to exactly how it looks right now.
  for (let i = 0; i < 150; i++) vrm.update(0.02);
  if (vrm.springBoneManager) vrm.springBoneManager.setInitState();
}
function applyRestPose() {
  if (!restPoseRawQuat) return;
  for (const name of REST_POSE_BONE_NAMES) {
    const q = restPoseRawQuat[name];
    const b = q && vrm.humanoid.getRawBoneNode(name);
    if (b) b.quaternion.copy(q);
  }
  // Also restore arm/hand POSITION (the clearance system nudges these away
  // from rest each gesture frame -- without this they'd keep the last
  // gesture's forward offset even after rotation is back to rest).
  for (const side of ["Left", "Right"]) {
    const s = side.toLowerCase();
    const upperArm = vrm.humanoid.getRawBoneNode(s + "UpperArm");
    if (upperArm && upperArmRestLocalPos[side]) upperArm.position.copy(upperArmRestLocalPos[side]);
    const lowerArm = vrm.humanoid.getRawBoneNode(s + "LowerArm");
    if (lowerArm && lowerArmRestLocalPos[side]) lowerArm.position.copy(lowerArmRestLocalPos[side]);
    const hand = vrm.humanoid.getRawBoneNode(s + "Hand");
    if (hand && handRestLocalPos[side]) hand.position.copy(handRestLocalPos[side]);
  }
  // The sleeve spring joints' actual parent isn't the humanoid arm bone
  // directly -- it's an aim-constraint bone (VRMNodeConstraintManager,
  // e.g. "J_Aim_R_TopsUpperArm") that TRACKS rightUpperArm's rotation.
  // Writing rightUpperArm's quaternion above doesn't move that constraint
  // bone by itself; nothing recomputes it until the constraint system
  // runs. Confirmed by direct inspection: after a reset, the spring
  // joint's own local quaternion matched the captured rest value exactly,
  // but its world-space tail position still didn't, because its parent
  // (the constraint bone) hadn't been told the arm moved. Re-running the
  // constraint pass now -- it reads the arm's local quaternion directly,
  // not matrixWorld, so this is safe to call before the matrix update
  // below -- brings the constraint bone back in sync with the just-reset
  // arm.
  if (vrm.nodeConstraintManager) vrm.nodeConstraintManager.update();
  // Spring-bone reset() reads each joint's PARENT world matrix live (e.g.
  // the aim-constraint bone's matrixWorld, for the sleeve joints) to work
  // out where it should end up -- but nothing above has recomputed that
  // matrix yet, so without a forced update here it's still whatever it
  // was at the end of the LAST render (i.e. the just-finished gesture's
  // pose, not the rotations just written above). That stale-parent-matrix
  // read is what was making reset() snap sleeves to the wrong place even
  // once the captured init state itself was correct. Forcing the world
  // matrices to recompute now, before reset() reads them, is what
  // actually fixes it.
  vrm.scene.updateMatrixWorld(true);
  // Snap the sleeve/hair spring bones back to the rest-pose init state
  // captured above, instead of leaving them to (maybe never) physically
  // settle there on their own -- see the comment in
  // captureRestPoseRawQuats() for why a plain .reset() wasn't enough on
  // its own without first re-capturing the init state.
  if (vrm.springBoneManager) vrm.springBoneManager.reset();
}
// true until a real gesture frame is shown (setFrame() flips it false);
// a page's own pause/stop logic flips it back to true once playback ends.
let showRestPose = true;

// Heartbeat: only acts when setFrame() hasn't rendered in the last 50ms --
// i.e. only during genuine idle stretches (before the first word is ever
// played, or between words/sentences). The moment real playback resumes,
// setFrame() marks window.__lastSetFrameAt itself and this backs off, so
// only one code path is ever driving vrm.update()/render() at a time --
// no dual-loop race, no flicker.
function idleHeartbeatTick() {
  const now = performance.now();
  if (now - (window.__lastSetFrameAt || 0) > 50) {
    applyIdleLayer(now - idleStartTime);
    vrmUpdateRealDelta();
    if (showRestPose) applyRestPose();
    renderer.render(scene, camera);
    requestAnimationFrame(idleHeartbeatTick);
  } else {
    // Actively playing right now, so this tick has nothing to do -- but
    // re-registering via requestAnimationFrame anyway would still claim a
    // rAF slot every single frame, competing with the playback loop's own
    // rAF registration for the browser's per-frame rAF budget purely for
    // the sake of an empty no-op. Back off to an infrequent timer check
    // instead while playback owns the frame; resume the tight rAF loop
    // the moment we're idle again.
    setTimeout(idleHeartbeatTick, 100);
  }
}

window.setFrame = function (i) {
  if (!entry) return { error: "no entry loaded" };
  window.__lastSetFrameAt = performance.now();
  showRestPose = false;
  const n = entry.frame_ids.length;
  const idx = Math.max(0, Math.min(n - 1, i));
  const dbg = { frame_id: entry.frame_ids[idx], idx };

  // Pose (arm chain) MUST run before applyHand(): the geometric wrist fix
  // in applyHand() reads the forearm bone's CURRENT-frame world
  // quaternion (to convert the hand's new world-space orientation into
  // the correct local quaternion), so the forearm has to already be
  // posed for this frame by the time applyHand() runs. See applyHand()'s
  // "Geometric wrist/palm orientation" comment.
  dbg.pose = applyPose(entry.body ? entry.body[idx] : null);
  // DH hand data -> VRM "right" side, NDH (incidental) -> VRM "left" side
  // (see ARM_CHAIN comment above for why this is the correct mapping).
  dbg.hand = applyHand(entry.landmarks[idx], "Right");
  // NDH (incidental_opposite_landmarks) is only present for some entries/
  // frames (e.g. "WATCH", "WAIT" -- two-handed gestures); applyHand already
  // no-ops on null input, same as it always has for the right hand on a
  // frame with no detection.
  dbg.handLeft = applyHand(entry.incidental_opposite_landmarks ? entry.incidental_opposite_landmarks[idx] : null, "Left");
  dbg.head = applyHead(entry.face ? entry.face[idx] : null);
  dbg.face = applyFace(entry.face ? entry.face[idx] : null);
  applyIdleLayer(performance.now() - idleStartTime);

  vrmUpdateRealDelta();
  applyPositionClearance("Left");
  applyPositionClearance("Right");
  applyHandSeparation();
  renderer.render(scene, camera);

  // sanity: scan all humanoid bone quaternions for NaN
  let nanBones = [];
  for (const boneName of Object.values({})) {}
  const allBoneNames = [
    "hips","spine","chest","neck","head",
    "leftUpperArm","leftLowerArm","leftHand",
    "rightUpperArm","rightLowerArm","rightHand",
  ];
  for (const bn of allBoneNames) {
    const b = getBone(bn);
    if (!b) continue;
    const q = b.quaternion;
    if ([q.x, q.y, q.z, q.w].some((v) => Number.isNaN(v))) nanBones.push(bn);
  }
  dbg.nanBones = nanBones;
  return dbg;
};

window.getFrameCount = function () {
  return entry ? entry.frame_ids.length : 0;
};

async function init() {
  const gltf = await loader.loadAsync("models/sample.vrm");
  vrm = gltf.userData.vrm;
  window.__vrm = vrm;
  VRMUtils.rotateVRM0(vrm); // no-op for VRM1 models, safe to call
  // BUG FOUND AND REMOVED (AK review, 2026-10-02): this line read
  // `vrm.scene.rotation.y = Math.PI` with a comment claiming the model
  // needed a 180 flip to face the camera (+Z) instead of its native -Z
  // forward. Checked directly with a minimal, isolated load (no pose, no
  // other corrections): this VRM1 sample model already faces the camera
  // with ZERO rotation applied -- the original comment's premise was
  // simply wrong. This one incorrect 180 was never the fix it looked like;
  // every other 180-ish correction found afterwards (head's y180, body
  // pose's xyz_flip, an attempted forearm-twist fix) was very likely
  // chasing the downstream consequences of THIS error, not independent
  // problems -- exactly AK's own diagnosis. Removed; the head/body/hand
  // corrections below are being re-derived from scratch now that the
  // starting frame is actually correct.
  scene.add(vrm.scene);
  captureArmRest();
  captureHandRest();
  computeClothingClearanceBox();
  window.armRest = armRest;
  window.handRest = handRest;
  const leftHandRawBone = vrm.humanoid.getRawBoneNode("leftHand");
  if (leftHandRawBone) handRestLocalPos.Left = leftHandRawBone.position.clone();
  const rightHandRawBone = vrm.humanoid.getRawBoneNode("rightHand");
  if (rightHandRawBone) handRestLocalPos.Right = rightHandRawBone.position.clone();
  const leftLowerArmRawBone = vrm.humanoid.getRawBoneNode("leftLowerArm");
  if (leftLowerArmRawBone) lowerArmRestLocalPos.Left = leftLowerArmRawBone.position.clone();
  const rightLowerArmRawBone = vrm.humanoid.getRawBoneNode("rightLowerArm");
  if (rightLowerArmRawBone) lowerArmRestLocalPos.Right = rightLowerArmRawBone.position.clone();
  const leftUpperArmRawBone = vrm.humanoid.getRawBoneNode("leftUpperArm");
  if (leftUpperArmRawBone) upperArmRestLocalPos.Left = leftUpperArmRawBone.position.clone();
  const rightUpperArmRawBone = vrm.humanoid.getRawBoneNode("rightUpperArm");
  if (rightUpperArmRawBone) upperArmRestLocalPos.Right = rightUpperArmRawBone.position.clone();
  setupGazeTarget();

  // DEBUG (2026-10-02): unambiguous per-fingertip color markers, so finger
  // identity can be read directly off a screenshot instead of guessed from
  // overall hand silhouette (which is exactly how the reversed-finger-order
  // bug went unnoticed before). Distinct, saturated colors, one per digit,
  // on the dominant (right) hand only.
  const FINGERTIP_COLORS = {
    rightThumbDistal: 0xff0000,   // red
    rightIndexDistal: 0x00ff00,   // green
    rightMiddleDistal: 0x0000ff,  // blue
    rightRingDistal: 0xffff00,    // yellow
    rightLittleDistal: 0xff00ff,  // magenta
  };
  for (const [boneName, color] of Object.entries(FINGERTIP_COLORS)) {
    const bone = getBone(boneName);
    if (!bone) continue;
    const marker = new THREE.Mesh(
      new THREE.SphereGeometry(0.012, 8, 8),
      new THREE.MeshBasicMaterial({ color })
    );
    bone.add(marker);
  }

  const entryId = currentEntryId();
  const res = await fetch(`data/entry_${entryId}.json`);
  entry = await res.json();

  window.__vrmBoneNames = vrm.humanoid ? Object.keys(vrm.humanoid.humanBones) : [];
  window.__exprNames = vrm.expressionManager ? vrm.expressionManager.expressions.map(e => e.expressionName) : [];

  window.setFrame(0);
  // Captured HERE, after a real gesture frame has actually been posed --
  // not right after model load. Turns out the raw skeleton right after
  // load is already T-pose-ish (confirmed by direct inspection), an
  // artifact of three-vrm's own humanoid/normalized-bone setup, not the
  // GLB's original authored bind pose -- so capturing it straight off the
  // loader would have "restored" T-pose right back. Capturing frame 0 of
  // the default entry instead reuses a pose that's already known to look
  // right (it's exactly what this page showed as its default preview
  // before any of this idle-layer work existed).
  captureRestPoseRawQuats();
  requestAnimationFrame(idleHeartbeatTick);
  window.__restPoseRawQuat = () => restPoseRawQuat;
  window.__showRestPose = () => showRestPose;
  window.__applyRestPoseNow = () => applyRestPose();
  window.__ready = true;
  window.__entry = entry;
  setupUI(entryId);
}

// --- Playback UI (2026-10-03) -----------------------------------------
// Available single-gloss entries extracted from gloss_library_v6_all_signers.json
// (see public/data/). Add an entry here (and extract its JSON the same way)
// to make a new gesture selectable without touching anything else.
const ENTRIES = [
  { id: "I", label: "I — Signer 1 / Session 1 (single gloss from \"I LOVE YOU\")" },
  { id: "WATCH", label: "WATCH — Signer 1 / Session 2" },
  { id: "STOP", label: "STOP! — Signer 1 / Session 3" },
  { id: "WAIT", label: "WAIT — Signer 1 / Session 3 (both hands, open palm)" },
];
function currentEntryId() {
  return new URLSearchParams(window.location.search).get("entry") || "I";
}
function setupUI(entryId) {
  if (new URLSearchParams(window.location.search).get("ui") === "0") {
    document.getElementById("ui").style.display = "none";
    return;
  }
  const sel = document.getElementById("entrySelect");
  for (const { id, label } of ENTRIES) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = label;
    if (id === entryId) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.addEventListener("change", () => {
    const url = new URL(window.location.href);
    url.searchParams.set("entry", sel.value);
    window.location.href = url.toString();
  });

  const n = entry.frame_ids.length;
  const slider = document.getElementById("frameSlider");
  slider.max = n - 1;
  const label = document.getElementById("frameLabel");
  const updateLabel = (i) => { label.textContent = `${i} / ${n - 1}`; };

  const FRAME_MS = 20; // source video is documented at 50fps (glosses.csv start_ms/end_ms convention)
  let playing = false, rafId = null, lastT = 0, curFrame = 0;
  function tick(t) {
    if (!playing) return;
    if (t - lastT >= FRAME_MS) {
      lastT = t;
      curFrame = (curFrame + 1) % n;
      window.setFrame(curFrame);
      slider.value = curFrame;
      updateLabel(curFrame);
    }
    rafId = requestAnimationFrame(tick);
  }
  function play() {
    if (playing) return;
    playing = true;
    playBtn.textContent = "Pause";
    lastT = 0;
    rafId = requestAnimationFrame(tick);
  }
  function pause() {
    playing = false;
    playBtn.textContent = "Play";
    if (rafId) cancelAnimationFrame(rafId);
    showRestPose = true;
  }
  const playBtn = document.getElementById("playBtn");
  playBtn.addEventListener("click", () => (playing ? pause() : play()));
  slider.addEventListener("input", () => {
    pause();
    curFrame = Number(slider.value);
    window.setFrame(curFrame);
    updateLabel(curFrame);
  });
  updateLabel(0);
  window.__pauseAnim = pause; // for any automated script that wants to take over setFrame() manually
}

// DEBUG ONLY: re-run applyHand with an arbitrary Kalidokit `side` flag while
// still writing into the "right" VRM bones, to test whether the DH hand
// landmark data's handedness convention matches what we're telling
// Kalidokit it is.
window.__applyHandSide = function (side, idx) {
  const lm = entry.landmarks[idx].map(([x, y, z]) => ({ x, y, z }));
  const solved = Kalidokit.Hand.solve(lm, side);
  for (const [kKey, vrmSuffix] of Object.entries(HAND_BONE_MAP)) {
    const val = solved[side + kKey];
    if (!val) continue;
    const bone = getBone("right" + vrmSuffix);
    if (!bone) continue;
    const e = new THREE.Euler(val.x || 0, val.y || 0, val.z || 0, "XYZ");
    bone.quaternion.setFromEuler(e);
  }
  vrm.update(0.016);
  renderer.render(scene, camera);
};

init().catch((e) => {
  window.__initError = String(e && e.stack || e);
  console.error(e);
});
</script>
</body>
</html>
